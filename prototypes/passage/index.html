<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>The passage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────────────────────────────────────────────────────────────────────
   THE PASSAGE — scripture-centric rituals on the existing ritual frame.

   Not production code. Three moments, one argument:
     1. CHOOSE  — a passage finder that replaces Lectio's "type the passage out"
     2. KEEP    — the passage stays in view while you write (three placements)
     3. LET IT ACT — a movement can do something to the passage: catch a word,
                  keep it lit, quote a verse into an answer.

   Verse text is the World English Bible (public domain), fetched from
   bible-api.com — never model memory (GUARDRAILS H3). The product serves ESV.
   State lives in localStorage so every scene reads the same ritual.
   ─────────────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

:root {
  --bg: #fbf6ee; --bg-elevated: #fffdf8; --bg-input: #f3ece0; --leaf: #f6efe2;
  --border-subtle: #ece3d4; --text: #4a4035; --text-bright: #2a2118;
  --text-dim: #8a7c69; --text-faint: #b4a78f; --accent: #c2683a;
  --accent-soft: rgba(194,104,58,.12);
  --gold: #b07a22; --gold-soft: rgba(214,160,64,.22); --gold-wash: rgba(214,160,64,.12);
  --shadow: rgba(60,40,10,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #16130f; --bg-elevated: #1e1a15; --bg-input: #25201a; --leaf: #1b1712;
    --border-subtle: #2e2820; --text: #d9cdbb; --text-bright: #f2e9da;
    --text-dim: #9a8b76; --text-faint: #5f5446; --accent: #dba85c;
    --accent-soft: rgba(219,168,92,.12);
    --gold: #f3bd76; --gold-soft: rgba(243,189,118,.22); --gold-wash: rgba(243,189,118,.09);
    --shadow: rgba(0,0,0,.35);
  }
}
:root[data-theme='dark'] {
  --bg: #16130f; --bg-elevated: #1e1a15; --bg-input: #25201a; --leaf: #1b1712;
  --border-subtle: #2e2820; --text: #d9cdbb; --text-bright: #f2e9da;
  --text-dim: #9a8b76; --text-faint: #5f5446; --accent: #dba85c;
  --accent-soft: rgba(219,168,92,.12);
  --gold: #f3bd76; --gold-soft: rgba(243,189,118,.22); --gold-wash: rgba(243,189,118,.09);
  --shadow: rgba(0,0,0,.35);
}
body {
  background: var(--bg); color: var(--text);
  font-family: 'Newsreader', Georgia, serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; }
textarea {
  display: block; width: 100%; border: 0; outline: 0; resize: none;
  background: transparent; color: var(--text-bright);
  font-family: 'Newsreader', Georgia, serif; font-size: 20px; line-height: 1.7; padding: 0;
}
textarea::placeholder { color: var(--text-faint); font-style: italic; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
a { color: inherit; }

/* ── prototype chrome (not the design) ─────────────────────────────────── */
#bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: .2rem; flex-wrap: wrap;
  padding: .5rem .9rem; border-bottom: 1px solid var(--border-subtle);
  font-family: Inter, system-ui, sans-serif; font-size: 12.5px;
  background: var(--bg-elevated); z-index: 30; position: relative;
}
#bar .t { color: var(--text-dim); margin-right: .6rem; letter-spacing: .02em; }
#bar button, #bar a.tab {
  border: 1px solid transparent; background: none; border-radius: 999px; text-decoration: none;
  padding: .3rem .7rem; cursor: pointer; color: var(--text-dim);
}
#bar button:hover, #bar a.tab:hover { color: var(--text-bright); }
#bar [aria-pressed='true'], #bar a.tab.on { border-color: var(--border-subtle); color: var(--text-bright); background: var(--bg); }
#bar .sp { flex: 1; }
#bar .grp { display: inline-flex; align-items: center; gap: .1rem; padding-left: .6rem; margin-left: .4rem; border-left: 1px solid var(--border-subtle); }
#bar .grp span { color: var(--text-faint); margin-right: .25rem; }
#stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#note {
  position: fixed; left: 1rem; bottom: 1rem; width: 320px; z-index: 40;
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  border-radius: 12px; padding: .85rem 1rem .95rem;
  font-family: Inter, system-ui, sans-serif; font-size: 12.5px; line-height: 1.55;
  color: var(--text-dim); box-shadow: 0 10px 30px var(--shadow);
}
#note h4 { margin: 0; font-size: 12.5px; color: var(--text-bright); font-weight: 500; cursor: pointer; padding-right: 1.4rem; }
#note .body p { margin: .45rem 0 0; }
#note b { color: var(--text); font-weight: 500; }
#note[data-min='true'] .body { display: none; }
#note[data-min='true'] { width: auto; padding: .55rem .9rem; }
#note .x { position: absolute; top: .6rem; right: .75rem; border: 0; background: none; cursor: pointer; color: var(--text-faint); }
.kbd {
  font-family: Inter, system-ui, sans-serif; font-size: 11px; color: var(--text-faint);
  border: 1px solid var(--border-subtle); border-radius: 5px; padding: 1px 5px; font-style: normal;
}

/* ── shared type ───────────────────────────────────────────────────────── */
.lbl { font-size: .66rem; font-weight: 500; letter-spacing: .19em; text-transform: uppercase; color: var(--accent); font-family: 'Newsreader', serif; }
.q { font-style: italic; color: var(--text); margin: .35rem 0 .9rem; line-height: 1.45; }
.link { border: 0; background: none; cursor: pointer; color: var(--text-dim); font-size: .95rem; padding: .3rem 0; text-decoration: none; }
.link:hover { color: var(--accent); }
.btn {
  border: 1px solid var(--border-subtle); border-radius: 999px; background: var(--bg-elevated);
  padding: .6rem 1.35rem; cursor: pointer; color: var(--text-bright); font-size: 1rem;
  display: inline-flex; align-items: center; gap: .6rem;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border-subtle)); }
.btn.primary { background: var(--text-bright); color: var(--bg); border-color: var(--text-bright); }
.btn.primary .kbd { color: color-mix(in srgb, var(--bg) 70%, transparent); border-color: color-mix(in srgb, var(--bg) 30%, transparent); }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
.sans { font-family: Inter, system-ui, sans-serif; }
@keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.arrive { animation: arrive .6s cubic-bezier(.2,.7,.2,1) both; }
.home {
  display: inline-flex; align-items: center; gap: .45rem; border: 0; background: none; cursor: pointer;
  padding: .2rem 0; color: var(--text-dim); font-size: .92rem; text-decoration: none;
}
.home:hover { color: var(--accent); }

/* ═══ THE PASSAGE (text) — shared by every scene ══════════════════════════ */
.psg { font-size: 1.2rem; line-height: 1.85; color: var(--text-bright); position: relative; }
.psg .vs { transition: opacity .5s ease; }
.psg .vn {
  font-family: Inter, system-ui, sans-serif; font-size: .58rem; color: var(--gold);
  vertical-align: .55em; margin: 0 .22em 0 .1em; font-weight: 500; letter-spacing: .02em;
}
.psg .w { border-radius: 3px; transition: background .2s, color .4s, opacity .6s; }
.psg mark.caught {
  background: var(--gold-soft); color: var(--text-bright); border-radius: 4px;
  box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: .05em .12em; margin: 0 -.12em;
  transition: box-shadow 1.2s ease;
}
.psg .sec { display: block; font-family: 'Newsreader', serif; font-style: italic; font-size: .92rem; color: var(--text-dim); margin: 1.3rem 0 .2rem; }
.psg .sec:first-child { margin-top: 0; }
.psg .para { display: block; margin-bottom: .6rem; }
/* kinds */
.psg[data-kind='mark'] { user-select: none; -webkit-user-select: none; }
.psg[data-kind='mark'] .w { cursor: pointer; }
.psg[data-kind='mark'] .w:hover, .psg .w.pre { background: var(--gold-wash); box-shadow: 0 1.5px 0 var(--gold-soft); }
.psg[data-kind='carry'] .w, .psg[data-kind='plain'] .w, .psg[data-kind='cite'] .w { opacity: .55; }
.psg[data-kind='carry'] mark .w, .psg[data-kind='plain'] mark .w, .psg[data-kind='cite'] mark .w { opacity: 1; }
.psg[data-kind='dwell'] .w, .psg[data-kind='dwell'] .vn, .psg[data-kind='dwell'] .sec { opacity: .13; transition: opacity 2.6s ease; }
.psg[data-kind='dwell'] mark .w { opacity: 1; animation: none; }
.psg[data-kind='dwell'] .w, .psg[data-kind='dwell'] .vn, .psg[data-kind='dwell'] .sec { animation: torest 3.2s ease both; }
@keyframes torest { from { opacity: 1; } to { opacity: .13; } }
.psg[data-kind='dwell'] mark.caught { box-shadow: 0 0 34px 6px var(--gold-soft); }
.psg[data-kind='cite'] .vn { cursor: pointer; padding: .1em .35em; border-radius: 99px; border: 1px solid transparent; }
.psg[data-kind='cite'] .vn:hover { border-color: var(--gold-soft); background: var(--gold-wash); }
.psg[data-kind='cite'] .vs.cited .vn { background: var(--gold-soft); color: var(--text-bright); }
.psg[data-kind='cite'] .vs:hover .w { opacity: 1; }
/* read again, slowly */
.psg.reading .vs { animation: slowin 1.6s ease both; animation-delay: var(--d); }
@keyframes slowin { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
.own {
  border: 1px dashed var(--border-subtle); border-radius: 12px; padding: 1.4rem 1.4rem 1.3rem;
  color: var(--text-dim); font-style: italic; font-size: 1.02rem; line-height: 1.6;
}
.own b { font-style: normal; color: var(--text-bright); font-weight: 400; font-size: 1.35rem; display: block; margin-bottom: .35rem; }

/* ═══ INTRO ══════════════════════════════════════════════════════════════ */
.v-intro { height: 100%; overflow-y: auto; }
.v-intro .col { max-width: 46rem; margin: 0 auto; padding: 4.5rem 2rem 8rem; }
.v-intro h1 { font-weight: 300; font-size: 2.6rem; line-height: 1.15; margin: .6rem 0 1.2rem; color: var(--text-bright); }
.v-intro p { font-size: 1.12rem; line-height: 1.7; margin: 0 0 1.1rem; }
.v-intro .moves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 2.2rem 0 2.4rem; }
.v-intro .moves div { border-top: 1px solid var(--border-subtle); padding-top: .9rem; }
.v-intro .moves h3 { font-weight: 400; font-size: 1.2rem; margin: .3rem 0 .35rem; color: var(--text-bright); }
.v-intro .moves p { font-size: .95rem; line-height: 1.55; color: var(--text-dim); margin: 0; }
.v-intro ol.scenes { list-style: none; padding: 0; margin: 1.5rem 0 0; border-top: 1px solid var(--border-subtle); }
.v-intro ol.scenes li { border-bottom: 1px solid var(--border-subtle); }
.v-intro ol.scenes a { display: grid; grid-template-columns: 9rem 1fr; gap: 1rem; padding: .95rem 0; text-decoration: none; }
.v-intro ol.scenes a:hover b { color: var(--accent); }
.v-intro ol.scenes b { font-weight: 400; color: var(--text-bright); font-size: 1.05rem; }
.v-intro ol.scenes span { color: var(--text-dim); font-size: .98rem; line-height: 1.5; }
.v-intro .practices { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 2rem 0; }
.pcard {
  border: 1px solid var(--border-subtle); border-radius: 14px; padding: 1.2rem 1.25rem 1.1rem; background: var(--bg-elevated);
  text-align: left; cursor: pointer; display: block; width: 100%; transition: border-color .2s, transform .2s;
}
.pcard:hover { border-color: color-mix(in srgb, var(--gold) 45%, var(--border-subtle)); transform: translateY(-1px); }
.pcard h3 { font-weight: 400; font-size: 1.3rem; margin: .25rem 0 .3rem; color: var(--text-bright); }
.pcard .o { font-style: italic; color: var(--text-faint); font-size: .9rem; }
.pcard p { color: var(--text-dim); font-size: .95rem; line-height: 1.5; margin: .6rem 0 .7rem; }
.pcard .path { font-family: Inter, sans-serif; font-size: 11.5px; color: var(--text-faint); letter-spacing: .02em; }
.pcard.later { cursor: default; opacity: .6; background: none; }
.pcard.later:hover { transform: none; border-color: var(--border-subtle); }

/* ═══ LIBRARY — the real shelf, with scripture rituals marked ═════════════ */
.v-lib { height: 100%; overflow-y: auto; background: radial-gradient(90% 50% at 70% -10%, var(--gold-wash), transparent 60%), var(--bg); }
.v-lib .col { max-width: 62rem; margin: 0 auto; padding: 3.6rem 2rem 8rem; }
.v-lib .eyebrow { font-family: Inter, sans-serif; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); }
.v-lib h1 { font-weight: 300; font-size: 2.2rem; margin: .5rem 0 .4rem; color: var(--text-bright); }
.v-lib h1 em { color: var(--accent); }
.v-lib .sub { color: var(--text-dim); font-size: 1rem; margin: 0 0 1.8rem; }
.libctl { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
.pfilter { font-family: Inter, sans-serif; font-size: 12px; letter-spacing: .06em; color: var(--text-dim); background: none; border: 1px solid transparent; border-radius: 999px; padding: .38rem .8rem; cursor: pointer; }
.pfilter:hover { border-color: var(--border-subtle); color: var(--text); }
.pfilter[data-on='true'] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.pfilter.scrip { display: inline-flex; align-items: center; gap: .4rem; }
.pfilter.scrip[data-on='true'] { color: var(--gold); border-color: var(--gold); background: var(--gold-wash); }
.libctl .div { width: 1px; height: 18px; background: var(--border-subtle); margin: 0 .3rem; }
.libctl .sp { flex: 1; }
.libctl input { font-family: Inter, sans-serif; font-size: 13px; border: 1px solid var(--border-subtle); background: var(--bg-elevated); border-radius: 999px; padding: .45rem .9rem; width: 15rem; color: var(--text-bright); outline: 0; }
.libctl input:focus { border-color: color-mix(in srgb, var(--accent) 45%, var(--border-subtle)); }
.libnote { font-style: italic; color: var(--text-dim); margin: -.4rem 0 1.2rem; font-size: .98rem; }
.lgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem; }
.lcard { text-align: left; border: 1px solid var(--border-subtle); background: color-mix(in srgb, var(--bg-elevated) 80%, transparent); border-radius: 12px; padding: 1rem 1.1rem .9rem; cursor: pointer; display: flex; flex-direction: column; gap: .3rem; transition: transform .2s, border-color .2s, box-shadow .2s; }
.lcard:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 35%, transparent); box-shadow: 0 8px 28px var(--shadow); }
.lcard.scripture { border-color: color-mix(in srgb, var(--gold) 28%, var(--border-subtle)); }
.lcard .fn { font-family: Inter, sans-serif; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.lcard .fn .new { margin-left: .5rem; letter-spacing: .06em; font-weight: 500; }
.lcard .nm { font-size: 1.15rem; color: var(--text-bright); }
.lcard .or { font-style: italic; color: var(--text-faint); font-size: .85rem; }
.lcard .qt { font-family: Inter, sans-serif; font-weight: 300; font-style: italic; font-size: 12.5px; color: var(--text-dim); line-height: 1.55; margin-top: .2rem; }
.lcard .ft { margin-top: auto; padding-top: .7rem; display: flex; align-items: center; gap: .6rem; font-family: Inter, sans-serif; font-size: 11px; color: var(--text-faint); }
.lcard .ft .ar { margin-left: auto; color: var(--text-faint); }
.stag { display: inline-flex; align-items: center; gap: .3rem; color: var(--gold); font-family: Inter, sans-serif; font-size: 11px; letter-spacing: .02em; }
.stag svg, .pfilter.scrip svg { width: 13px; height: 13px; }
.thresh { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); z-index: 10; overflow-y: auto; display: flex; justify-content: center; }
.thresh .in { max-width: 34rem; padding: 4.5rem 2rem 4rem; text-align: center; }
.thresh .back { position: absolute; top: 1.4rem; left: 2rem; }
.thresh .nm { font-size: 2.2rem; font-weight: 300; color: var(--text-bright); margin: .4rem 0 .2rem; }
.thresh .or { font-style: italic; color: var(--text-faint); }
.thresh .div { width: 40px; height: 1px; background: var(--border-subtle); margin: 1.4rem auto; }
.thresh .it { font-size: 1.1rem; line-height: 1.6; color: var(--text); }
.thresh .first { margin: 1.6rem 0 0; padding: .9rem 1.1rem; border: 1px solid color-mix(in srgb, var(--gold) 30%, var(--border-subtle)); border-radius: 12px; background: var(--gold-wash); text-align: left; display: flex; gap: .8rem; align-items: flex-start; }
.thresh .first svg { width: 18px; height: 18px; color: var(--gold); flex: 0 0 auto; margin-top: .2rem; }
.thresh .first b { display: block; font-weight: 400; color: var(--text-bright); }
.thresh .first span { color: var(--text-dim); font-size: .95rem; font-style: italic; }
.thresh ol { list-style: none; padding: 0; margin: 1.6rem 0 2rem; text-align: left; }
.thresh ol li { padding: .55rem 0; border-top: 1px solid var(--border-subtle); display: flex; gap: 1rem; align-items: baseline; }
.thresh ol li .lbl { flex: 0 0 11rem; }
.thresh ol li span:last-child { color: var(--text-dim); font-style: italic; font-size: .95rem; }

/* ═══ FIND — the passage finder ═══════════════════════════════════════════ */
.v-find { height: 100%; overflow-y: auto; position: relative; background:
  radial-gradient(120% 60% at 50% -10%, var(--gold-wash), transparent 60%), var(--bg); }
.v-find .corner { position: absolute; top: 1.6rem; left: 2rem; z-index: 2; }
.v-find .col { max-width: 44rem; margin: 0 auto; padding: 5rem 2rem 10rem; }
.v-find .eyebrow { display: flex; align-items: baseline; gap: .7rem; }
.v-find .eyebrow .o { font-style: italic; color: var(--text-faint); font-size: .9rem; }
.v-find h1 { font-weight: 300; font-size: 2.35rem; margin: .5rem 0 1.4rem; color: var(--text-bright); letter-spacing: -.005em; }
.v-find .inwrap { position: relative; }
.v-find input.q-in {
  width: 100%; border: 0; outline: 0; background: transparent; color: var(--text-bright);
  font-family: 'Newsreader', serif; font-size: 1.7rem; font-weight: 300; padding: .35rem 0 .6rem;
  border-bottom: 1px solid var(--border-subtle); transition: border-color .3s;
}
.v-find input.q-in:focus { border-bottom-color: color-mix(in srgb, var(--gold) 55%, var(--border-subtle)); }
.v-find input.q-in::placeholder { color: var(--text-faint); font-style: italic; }
.v-find .hint { font-family: Inter, sans-serif; font-size: 12px; color: var(--text-faint); margin-top: .6rem; display: flex; gap: 1rem; flex-wrap: wrap; }
.v-find .hint .why { font-family: 'Newsreader', serif; font-style: italic; font-size: .95rem; color: var(--text-dim); }
.fsec { margin-top: 2.4rem; }
.fsec h5 { margin: 0 0 .8rem; font-family: Inter, sans-serif; font-weight: 500; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); }
.fsec .src { font-family: Inter, sans-serif; font-size: 11px; color: var(--text-faint); letter-spacing: 0; text-transform: none; font-weight: 400; margin-left: .5rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip {
  border: 1px solid var(--border-subtle); border-radius: 999px; background: var(--bg-elevated);
  padding: .45rem .95rem; cursor: pointer; font-size: 1rem; color: var(--text-bright);
  display: inline-flex; align-items: center; gap: .5rem;
}
.chip:hover { border-color: color-mix(in srgb, var(--gold) 45%, var(--border-subtle)); }
.chip .glow { width: 7px; height: 7px; border-radius: 99px; background: var(--gold); box-shadow: 0 0 8px var(--gold); opacity: var(--h, .6); }
.row {
  display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; align-items: baseline; width: 100%; text-align: left;
  border: 0; border-top: 1px solid var(--border-subtle); background: none; cursor: pointer; padding: .95rem .2rem;
}
.row:last-child { border-bottom: 1px solid var(--border-subtle); }
.row:hover .r, .row.kb .r { color: var(--accent); }
.row.kb { background: var(--gold-wash); }
.row .r { font-size: 1.15rem; color: var(--text-bright); }
.row .m { font-family: Inter, sans-serif; font-size: 11.5px; color: var(--text-faint); }
.row .t { grid-column: 1 / -1; color: var(--text-dim); font-style: italic; font-size: .98rem; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.canon { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem 2rem; }
.canon .t5 { font-family: Inter, sans-serif; font-size: 10.5px; color: var(--text-faint); letter-spacing: .1em; text-transform: uppercase; margin-bottom: .5rem; }
.canon .books { display: flex; flex-wrap: wrap; gap: .1rem .15rem; line-height: 1.3; }
.bk {
  border: 0; background: none; cursor: pointer; padding: .12rem .3rem; border-radius: 5px; font-size: .95rem;
  color: color-mix(in srgb, var(--gold) calc(var(--h) * 100%), var(--text-faint));
  text-shadow: 0 0 calc(var(--h) * 14px) color-mix(in srgb, var(--gold) calc(var(--h) * 70%), transparent);
}
.bk:hover { background: var(--gold-wash); color: var(--text-bright); }
.chstrip { display: flex; flex-wrap: wrap; gap: 5px; }
.ch {
  width: 34px; height: 34px; border-radius: 7px; border: 1px solid var(--border-subtle); cursor: pointer;
  font-family: Inter, sans-serif; font-size: 11.5px; color: var(--text-dim);
  background: color-mix(in srgb, var(--gold) calc(var(--h) * 38%), var(--bg-elevated));
}
.ch:hover { border-color: var(--gold); color: var(--text-bright); }
.ch.here { box-shadow: 0 0 12px -2px var(--gold); }
.reader-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 2.2rem 0 1.2rem; }
.reader-head h2 { font-weight: 400; font-size: 1.6rem; margin: 0; color: var(--text-bright); }
.reader-head .nav { font-family: Inter, sans-serif; font-size: 12px; color: var(--text-faint); }
.reading-view .psg .vs { cursor: pointer; border-radius: 4px; }
.reading-view .psg .vs:hover .w { background: var(--gold-wash); }
.reading-view .psg.has-sel .vs .w { opacity: .38; }
.reading-view .psg.has-sel .vs.sel .w { opacity: 1; background: var(--gold-wash); }
.reading-view .psg .sec { cursor: pointer; }
.reading-view .psg .sec:hover { color: var(--accent); }
.reading-view .psg .sec::after { content: '  · choose this section'; font-size: .78rem; opacity: 0; transition: opacity .2s; font-family: Inter, sans-serif; font-style: normal; }
.reading-view .psg .sec:hover::after { opacity: 1; }
.selbar {
  position: sticky; bottom: 1.4rem; margin-top: 2rem; z-index: 3;
  display: flex; align-items: center; gap: 1rem; padding: .75rem .8rem .75rem 1.3rem;
  background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 999px;
  box-shadow: 0 14px 40px var(--shadow);
}
.selbar .r { font-size: 1.1rem; color: var(--text-bright); }
.selbar .n { font-family: Inter, sans-serif; font-size: 11.5px; color: var(--text-faint); }
.selbar .sp { flex: 1; }
.softnote { font-style: italic; color: var(--text-dim); font-size: .98rem; margin: 1rem 0 0; line-height: 1.55; }
.softnote .link { font-size: .95rem; font-style: normal; }
.been { margin: 1.2rem 0 0; padding: .8rem 1rem; border-left: 2px solid var(--gold-soft); color: var(--text-dim); font-size: 1rem; line-height: 1.5; }
.been a { color: var(--text-bright); }
.empty-msg { color: var(--text-dim); font-style: italic; font-size: 1.05rem; line-height: 1.6; padding: .6rem 0; }

/* ═══ WALK — shared rail + page ══════════════════════════════════════════ */
.v-walk { height: 100%; }
.rail {
  border-right: 1px solid var(--border-subtle); padding: 2.85rem 1.6rem 1.6rem 2rem;
  display: flex; flex-direction: column; gap: .2rem; overflow-y: auto; min-height: 0;
}
.rail .home { margin: -1.2rem 0 2rem; align-self: flex-start; }
.rail h1 { font-weight: 400; font-size: 1.35rem; margin: 0; color: var(--text-bright); }
.rail .intent { font-style: italic; color: var(--text-faint); font-size: .88rem; line-height: 1.45; margin: .35rem 0 2rem; }
.path { list-style: none; margin: 0; padding: 0; position: relative; }
.path::before { content: ''; position: absolute; left: 4px; top: 10px; bottom: 10px; width: 1px; background: var(--border-subtle); }
.path li { position: relative; padding: .5rem 0 .65rem 1.4rem; cursor: pointer; }
.path li::before {
  content: ''; position: absolute; left: 0; top: .9rem; width: 9px; height: 9px; border-radius: 99px;
  background: var(--bg); border: 1px solid var(--text-faint);
}
.path li.done::before { background: color-mix(in srgb, var(--accent) 45%, var(--bg)); border-color: transparent; }
.path li.on::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.path li .lbl { color: var(--text-dim); }
.path li.on .lbl { color: var(--accent); }
.path li.ahead { cursor: default; }
.path li.ahead .lbl { color: var(--text-faint); }
.path li .gist { font-size: .9rem; color: var(--text-dim); margin-top: .2rem; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.path li .gist.ref { color: var(--gold); font-style: normal; }
.rail .foot { margin-top: auto; padding-top: 1.6rem; display: flex; gap: 1rem; }
.rail .foot .link, .leaf .foot .link { font-size: .85rem; }
.rail .saved, .leaf .saved { font-family: Inter, sans-serif; font-size: 11px; color: var(--text-faint); margin-top: .6rem; }
.page-wrap { overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
.page { flex: 1; max-width: 44rem; width: 100%; margin: 0 auto; padding: 5.5rem 2.5rem 2rem; display: flex; flex-direction: column; }
.page .q { font-size: 1.7rem; line-height: 1.35; color: var(--text-bright); margin: .6rem 0 2rem; font-weight: 300; }
.page textarea { flex: 1; min-height: 14rem; }
.page .caughtq { font-size: 1.5rem; font-style: italic; color: var(--text-bright); margin: -.6rem 0 1.6rem; line-height: 1.4; }
.page .caughtq .cq::before { content: '“'; color: var(--gold); }
.page .caughtq .cq::after { content: '”'; color: var(--gold); }
.page .caughtq .link { font-size: .85rem; font-style: normal; margin-left: .6rem; }
.page .await { color: var(--text-faint); font-style: italic; font-size: 1.05rem; margin: -.8rem 0 1.6rem; display: flex; align-items: center; gap: .6rem; }
.page .await::before { content: ''; width: 22px; height: 1px; background: var(--gold); opacity: .6; }
.page .typein { border: 0; border-bottom: 1px solid var(--border-subtle); background: none; outline: 0; font: inherit; font-size: 1.4rem; font-style: italic; color: var(--text-bright); padding: .2rem 0 .4rem; margin: -.6rem 0 1.6rem; width: 100%; }
.pfoot { display: flex; justify-content: space-between; align-items: center; max-width: 44rem; width: 100%; margin: 0 auto; padding: 1rem 2.5rem 2rem; gap: 1rem; }
.pfoot .r { display: flex; gap: .6rem; align-items: center; }
.dwell-page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.2rem; }
.dwell-page .word { font-size: 2.3rem; font-weight: 300; font-style: italic; color: var(--text-bright); line-height: 1.3; max-width: 30rem; animation: breathe 7s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
.dwell-page p { color: var(--text-dim); font-style: italic; margin: 0; }
.close { margin: auto; text-align: center; padding: 2rem; }
.close h2 { font-weight: 400; font-size: 1.9rem; margin: 0 0 .3rem; color: var(--text-bright); }
.close p { font-style: italic; color: var(--text-dim); margin: 0 0 1.6rem; }
.close .r { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }

/* ── A · FACING ── the rail becomes the open Bible ─────────────────────── */
.v-face { height: 100%; display: grid; }
.leaf {
  background: var(--leaf); border-right: 1px solid var(--border-subtle); min-height: 0; overflow-y: auto;
  padding: 2.85rem 2.6rem 1.6rem 3rem; display: flex; flex-direction: column;
  box-shadow: inset -30px 0 40px -40px var(--shadow);
}
.leaf .home { margin: -1.2rem 0 1.8rem; align-self: flex-start; }
.leaf .who { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
.leaf .who h1 { font-weight: 400; font-size: 1.2rem; margin: 0; color: var(--text-bright); }
.hpath { display: flex; gap: .35rem; flex-wrap: wrap; margin: .8rem 0 2.6rem; list-style: none; padding: 0; }
.hpath li { font-size: .6rem; letter-spacing: .17em; text-transform: uppercase; color: var(--text-faint); display: flex; align-items: center; gap: .35rem; cursor: default; position: relative; }
.hpath li + li::before { content: ''; width: 14px; height: 1px; background: var(--border-subtle); margin-right: .1rem; }
.hpath li.done { color: var(--text-dim); cursor: pointer; }
.hpath li.done:hover { color: var(--accent); }
.hpath li.on { color: var(--accent); }
.hpath li .tip {
  position: absolute; top: 1.4rem; left: 0; width: 240px; z-index: 5; display: none;
  background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 10px; padding: .6rem .75rem;
  font-size: .9rem; letter-spacing: 0; text-transform: none; color: var(--text); line-height: 1.4; box-shadow: 0 8px 24px var(--shadow);
}
.hpath li.done:hover .tip { display: block; }
.leaf .refline { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.leaf .refline .ref { font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
.leaf .refline .link { font-size: .85rem; }
.leaf .psg { font-size: 1.28rem; line-height: 1.9; }
.leaf .under { margin-top: 1.2rem; display: flex; gap: 1.1rem; }
.leaf .under .link { font-size: .88rem; }
.leaf .foot { margin-top: auto; padding-top: 2rem; display: flex; gap: 1rem; align-items: center; }
.leaf .attrib { font-family: Inter, sans-serif; font-size: 10.5px; color: var(--text-faint); margin-left: auto; }

/* the leaf keeps the rail's anatomy */
.leaf .intent { font-style: italic; color: var(--text-faint); font-size: .88rem; line-height: 1.45; margin: .3rem 0 0; max-width: 34rem; }
.hpath li .dot { width: 7px; height: 7px; border-radius: 99px; border: 1px solid var(--text-faint); background: var(--bg); flex: 0 0 auto; }
.hpath li.done .dot { background: color-mix(in srgb, var(--accent) 45%, var(--bg)); border-color: transparent; }
.hpath li.on .dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hpath { margin-top: 1.2rem; }
/* focus: while you type, the leaf keeps only the passage */
.leaf .chrome, .leaf .who { transition: opacity .6s ease; }
.v-face.typing .leaf .chrome, .v-face.typing .leaf .who { opacity: .12; }
.v-face.typing .page > .lbl, .v-face.typing .pfoot { opacity: .35; transition: opacity .6s ease; }
/* the rail widens into the leaf */
.v-face { grid-template-columns: max(380px, 45%) 1fr; }
.v-face.widen { animation: widen .9s cubic-bezier(.3,.7,.2,1) both; }
@keyframes widen { from { grid-template-columns: 280px 1fr; } to { grid-template-columns: max(380px, 45%) 1fr; } }
.v-face.widen .leaf .psg, .v-face.widen .leaf .refline { animation: arrive .8s .45s cubic-bezier(.2,.7,.2,1) both; }
/* About — the same sheet every ritual has */
.sheet-wrap { position: absolute; inset: 0; z-index: 25; }
.sheet-scrim { position: absolute; inset: 0; border: 0; background: color-mix(in srgb, var(--bg) 55%, transparent); cursor: pointer; }
.about { position: absolute; top: 0; right: 0; bottom: 0; width: min(430px, 92vw); background: var(--bg-elevated); border-left: 1px solid var(--border-subtle); box-shadow: -20px 0 50px var(--shadow); padding: 2.6rem 2.2rem 2.4rem; overflow-y: auto; }
.about .x { position: absolute; top: 1rem; right: 1.2rem; font-size: 1.4rem; }
.about h2 { font-weight: 400; font-size: 1.7rem; margin: .3rem 0 .2rem; color: var(--text-bright); }
.about .or { font-style: italic; color: var(--text-faint); font-size: .92rem; }
.about .div { width: 36px; height: 1px; background: var(--border-subtle); margin: 1.2rem 0; }
.about .lead { font-size: 1.1rem; line-height: 1.55; color: var(--text-bright); margin: 0 0 1.2rem; }
.about h3 { font-family: Inter, sans-serif; font-weight: 500; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); margin: 1.4rem 0 .4rem; }
.about p, .about li { font-size: .98rem; line-height: 1.6; color: var(--text); margin: 0; }
.about ul { padding-left: 1.1rem; margin: 0; } .about li { margin-bottom: .35rem; }
.about .quote { margin-top: 1.6rem; font-style: italic; color: var(--text-dim); }
.about .first { padding: .8rem 1rem; border: 1px solid color-mix(in srgb, var(--gold) 30%, var(--border-subtle)); border-radius: 12px; background: var(--gold-wash); display: flex; gap: .7rem; align-items: flex-start; }
.about .first svg { width: 17px; height: 17px; color: var(--gold); flex: 0 0 auto; margin-top: .2rem; }
.about .first b { display: block; font-weight: 400; color: var(--text-bright); } .about .first span { color: var(--text-dim); font-style: italic; font-size: .93rem; }

/* ── B · ABOVE ── the passage heads the page, folds while you write ───── */
.v-above { height: 100%; display: grid; grid-template-columns: 280px 1fr; }
.pblock {
  border-left: 2px solid var(--gold-soft); padding: .1rem 0 .1rem 1.3rem; margin: 0 0 2.2rem;
  transition: all .35s ease;
}
.pblock .ref { font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.pblock .ref .link { font-size: .8rem; letter-spacing: 0; text-transform: none; font-weight: 400; }
.pblock .psg { font-size: 1.08rem; line-height: 1.8; margin-top: .5rem; }
.pblock.folded { cursor: pointer; margin-bottom: 1.4rem; }
.pblock.folded .psg, .pblock.folded .under { display: none; }
.pblock .strip { display: none; color: var(--text-dim); font-style: italic; font-size: 1rem; margin-top: .25rem; }
.pblock.folded .strip { display: block; }
.pblock .strip mark { background: var(--gold-soft); color: var(--text-bright); border-radius: 3px; padding: 0 .15em; font-style: normal; }
.pblock.big .psg { font-size: 1.35rem; line-height: 1.95; }
.pblock .under { margin-top: .8rem; display: flex; gap: 1rem; }
.pblock .under .link { font-size: .85rem; }

/* ── C · BESIDE ── today's parts: rail + page + floating chapter pane ── */
.v-beside { height: 100%; display: grid; grid-template-columns: 280px 1fr 360px; }
.cpane { border-left: 1px solid var(--border-subtle); background: var(--bg-elevated); overflow-y: auto; padding: 1.3rem 1.5rem 2rem; min-height: 0; }
.cpane .top { display: flex; justify-content: space-between; align-items: baseline; font-family: Inter, sans-serif; font-size: 12px; color: var(--text-dim); margin-bottom: 1rem; }
.cpane .psg { font-size: 1rem; line-height: 1.75; }
.cpane .psg .vs.cited { background: var(--gold-wash); border-radius: 4px; box-shadow: -8px 0 0 var(--gold-wash); }
.cpane .psg .vs:not(.cited) .w { opacity: .68; }
.v-beside .page .todaynote { font-family: Inter, sans-serif; font-size: 12px; line-height: 1.5; color: var(--text-faint); margin: -2.5rem 0 1.6rem; max-width: 30rem; }
.cpane .psg .vs.cited .w { opacity: 1; }

/* ═══ Confirm ═══════════════════════════════════════════════════════════ */
.scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 60%, transparent); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 20; }
.dialog { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 1.6rem 1.8rem 1.4rem; max-width: 30rem; box-shadow: 0 20px 60px var(--shadow); }
.dialog h3 { font-weight: 400; font-size: 1.35rem; margin: 0 0 .6rem; color: var(--text-bright); }
.dialog p { margin: 0 0 1.2rem; line-height: 1.6; color: var(--text); }
.dialog .r { display: flex; gap: .7rem; justify-content: flex-end; flex-wrap: wrap; }

/* ═══ EDGES ═══════════════════════════════════════════════════════════════ */
.v-edge { height: 100%; overflow-y: auto; }
.v-edge .col { max-width: 66rem; margin: 0 auto; padding: 3.5rem 2rem 8rem; }
.v-edge h1 { font-weight: 300; font-size: 2.1rem; margin: .4rem 0 .6rem; color: var(--text-bright); }
.v-edge .lede { font-size: 1.08rem; line-height: 1.65; max-width: 44rem; margin: 0 0 2.4rem; }
.v-edge h2 { font-weight: 400; font-size: 1.05rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 3rem 0 1rem; font-size: .72rem; }
.slashdemo { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem; align-items: start; border: 1px solid var(--border-subtle); border-radius: 16px; padding: 1.6rem 1.8rem; background: var(--bg-elevated); }
.slashdemo .mini .lbl { display: block; }
.slashdemo .mini .q { font-size: 1.2rem; margin-bottom: 1rem; }
.slashdemo textarea { font-size: 18px; min-height: 5rem; }
.slashdemo .rule { font-size: .98rem; line-height: 1.6; color: var(--text); }
.slashdemo .rule p { margin: 0 0 .8rem; }
.slashdemo .rule b { font-weight: 500; color: var(--text-bright); }
.palette {
  margin-top: .6rem; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--bg); overflow: hidden;
  box-shadow: 0 12px 32px var(--shadow); max-width: 26rem; font-size: .98rem;
}
.palette .h { font-family: Inter, sans-serif; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); padding: .7rem .9rem .3rem; }
.palette button { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: .45rem .9rem; color: var(--text); line-height: 1.4; }
.palette button:hover { background: var(--gold-wash); color: var(--text-bright); }
.palette button small { display: block; color: var(--text-faint); font-style: italic; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xref { border-left: 2px solid var(--gold-soft); padding: .3rem 0 .3rem .9rem; margin: .8rem 0; font-size: .98rem; line-height: 1.6; color: var(--text-bright); }
.xref .c { display: block; font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-top: .25rem; }
.quoteline { color: var(--text-bright); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1rem; }
.ecard { border: 1px solid var(--border-subtle); border-radius: 14px; padding: 1.1rem 1.2rem 1rem; background: var(--bg-elevated); display: flex; flex-direction: column; }
.ecard h3 { font-weight: 400; font-size: 1.12rem; margin: 0 0 .45rem; color: var(--text-bright); line-height: 1.3; }
.ecard .when { font-style: italic; color: var(--text-dim); font-size: .95rem; margin: 0 0 .6rem; line-height: 1.45; }
.ecard .then { font-size: .95rem; line-height: 1.55; margin: 0 0 .6rem; }
.ecard .why { font-family: Inter, sans-serif; font-size: 11.5px; line-height: 1.5; color: var(--text-faint); margin: 0; }
.ecard .try { margin-top: auto; padding-top: .7rem; }
.ecard .try .link { font-size: .9rem; color: var(--accent); }
.ecard.lean { border-color: color-mix(in srgb, var(--gold) 35%, var(--border-subtle)); }

/* ═══ PHONE ═══════════════════════════════════════════════════════════════ */
.v-phone { height: 100%; overflow: auto; }
.v-phone .col { padding: 2.4rem 2rem 6rem; }
.v-phone .intro { max-width: 44rem; margin: 0 auto 2rem; font-size: 1.05rem; line-height: 1.6; }
.v-phone .intro h1 { font-weight: 300; font-size: 2rem; margin: 0 0 .5rem; color: var(--text-bright); }
.phones { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
.phonewrap { display: flex; flex-direction: column; align-items: center; gap: .8rem; width: 300px; }
.phonewrap .cap { font-size: .95rem; line-height: 1.45; color: var(--text-dim); text-align: center; font-style: italic; }
.phonewrap .cap b { font-style: normal; color: var(--text-bright); font-weight: 400; display: block; }
.phone {
  width: 300px; height: 620px; border-radius: 42px; border: 9px solid #1c1813; background: var(--bg);
  position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 18px 50px var(--shadow);
}
:root[data-theme='dark'] .phone { border-color: #3a3229; }
.phone .sb { height: 38px; flex: 0 0 auto; }
.phone .top { display: flex; align-items: center; justify-content: space-between; padding: 0 1rem .4rem; font-family: Inter, sans-serif; font-size: 11.5px; color: var(--text-dim); }
.phone .pips { display: flex; justify-content: center; gap: 4px; padding: .1rem 0 .6rem; }
.phone .pip { width: 16px; height: 2px; border-radius: 2px; background: var(--border-subtle); }
.phone .pip.done { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.phone .pip.on { background: var(--accent); }
.phone .body { flex: 1; min-height: 0; overflow: hidden; padding: 0 1.1rem; display: flex; flex-direction: column; }
.phone .psg { font-size: .98rem; line-height: 1.7; }
.phone .lbl { font-size: .56rem; }
.phone .q { font-size: 1.05rem; margin: .25rem 0 .6rem; }
.phone .ta { color: var(--text-bright); font-size: 1rem; line-height: 1.55; }
.phone .ta .caret { display: inline-block; width: 1.5px; height: 1.1em; background: var(--accent); vertical-align: -.2em; animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.phone .kb { flex: 0 0 auto; height: 205px; background: color-mix(in srgb, var(--text-faint) 22%, var(--bg-input)); display: grid; grid-template-rows: repeat(4, 1fr); gap: 7px; padding: 8px 4px 22px; }
.phone .kb div { display: flex; gap: 5px; justify-content: center; }
.phone .kb span { flex: 0 0 22px; background: var(--bg-elevated); border-radius: 5px; box-shadow: 0 1px 0 var(--shadow); }
.phone .kb .wide { flex: 1 1 auto; }
.phone .bot { padding: .7rem 1.1rem 1.4rem; display: flex; justify-content: space-between; align-items: center; }
.phone .bot .btn { font-size: .85rem; padding: .45rem 1rem; }
.phone .pstrip {

function verseHTML(n, text, caught) {

}
function passageHTML(p, { kind = 'read', caught = null, sections = true, cited = [], sel = null } = {}) {
  const vs = inRange(p);
  if (!vs.length) return `<div class="empty-msg">This prototype only carries John 15, Mark 4, Luke 15, Psalm 23 and Matthew 11:25–30.</div>`;
  const secs = sections ? (SECTIONS[corpusKey(p.book, p.chapter)] || []) : [];
  let out = '';
  vs.forEach(([n, t], i) => {
    const sec = secs.find(([s]) => s === n);
    if (sec && (i > 0 || secs.length > 1)) out += `<span class="sec" data-sec="${n}">${esc(sec[1])}</span>`;

    out += verseHTML(n, t, caught).replace('class="vs"', `class="vs${cls}" style="--d:${(i * 1.7).toFixed(1)}s"`);
  });
  const body = `<div class="body">${out}</div>`;

}

function parseQuery(q) {

  const norm = (s) => s.toLowerCase();
  let book = BOOKS.find((b) => norm(b.name) === name) || (ALIASES[name.replace(/ /g, '')] && BOOKS.find((b) => b.name === ALIASES[name.replace(/ /g, '')]));
  const prefix = BOOKS.filter((b) => norm(b.name).startsWith(name) || norm(b.name).replace(/^\d /, '').startsWith(name));
  if (!book && prefix.length === 1 && name.length >= 3) book = prefix[0];

    if (ch == null) return { type: 'book', book: book.name, also: prefix.filter((b) => b !== book).slice(0, 5) };
    return { type: 'ref', book: book.name, chapter: Math.min(ch, book.chapters), from: v1, to: v2 };
  }
  if (prefix.length && ch == null) return { type: 'books', books: prefix.slice(0, 7), word: raw };
  // a typo?
  let best = null, bd = 9;
  for (const b of BOOKS) { const d = lev(name, norm(b.name)); if (d < bd) { bd = d; best = b; } }
  if (best && bd <= 2 && name.length >= 3) return { type: 'typo', book: best.name, chapter: ch, from: v1, to: v2, typed: m[1].trim() };

function lev(a, b) {

}

      page = page.replace(/<div class="page arrive" data-step="0">[\s\S]*?<\/div><div class="pfoot">/, `<div class="page arrive" data-step="0"><div class="todaynote">Today’s real first prompt. Typing <span class="mono">/scripture</span> here makes a verse block; clicking it opens the chapter pane →</div><span class="lbl">${m0.label}</span><div class="q">What passage are you bringing? Read it slowly, twice. What word or phrase caught you?</div><textarea data-ans="0" placeholder="Write the passage, then the word that found you…">${esc(answer(0))}</textarea></div><div class="pfoot">`);

}

function recordMarkdown(k) {
  const pr = PRACTICES[k], p = S.passage[k] || pr.fallback;
  const saved = S.practice; S.practice = k;
  const ct = caughtText(); S.practice = saved;
  const text = S.ownBible ? '' : inRange(p).map(([, t]) => t).join(' ');
  let md = `<span class="tok">&lt;!-- ritual:name:${pr.name} --&gt;</span>\n`;
  pr.moves.forEach((m, i) => {
    md += `<span class="tok">&lt;!-- ritual:section:${esc(m.label)} --&gt;</span>\n`;
    const a = S.answers[`${k}:${i}`] || '';
    if (m.kind === 'read') md += `<span class="fence new">\`\`\`dayspring-scripture 7c1e0b52-…\n${esc(text)}${text ? '\n' : ''}${esc(refLabel(p))} · ${S.ownBible ? 'own Bible' : 'ESV'}\n\`\`\`</span>\n`;
    else if (m.kind === 'mark') md += (ct ? `<span class="new">&gt; ${esc(ct)}</span>\n\n` : '') + (a ? esc(a) + '\n' : '');
    else if (m.kind === 'dwell') md += '';
    else md += a ? esc(a).replace(/“([^”]+)” \(v\. (\d+)\)/g, '<span class="new">“$1” (v. $2)</span>') + '\n' : '';
  });
  md += `<span class="tok">&lt;!-- ritual:end --&gt;</span>`;
  return md;
}
function readerHTML(k) {

    </table></div>

    <div class="decisions"><h2>Decisions for Phil</h2><ol>
      <li><b>Where the passage sits on a desk: Facing (A) or Above (B)?</b><span class="lean">Lean: A. Lectio is re-reading, and A is the only layout where the text never moves while you write. B is the phone’s shape anyway, so it’s built either way.</span></li>
      <li><b>SOAP and Discovery side by side?</b><span class="lean">SOAP is already on the shelf, so it gets the finder and the leaf with no new copy. Discovery is the one new card. They overlap: both read, observe, apply. What Discovery adds is “about God / about us” and “who to tell”. Lean: ship both, and let <span class="mono">ritual_finished</span> say whether people tell them apart.</span></li>
      <li><b>“Where you left off” in Discovery: the next section after your last study.</b><span class="lean">It’s grounded, but it leans toward a reading plan (a VISION non-goal). Lean: keep it to exactly one row, the next section, with no progress through the book and nothing shown when there’s no history.</span></li>
      <li><b>Should the next Discovery show last week’s “I will”?</b><span class="lean">DBS groups ask “how did your I will go?” Verbatim is grounded, but a remembered promise is a verdict waiting to happen (Principle 2). Lean: not in v1. Ask Kristi/Judy.</span></li>
      <li><b>The caught word as a <span class="mono">&gt;</span> quote line, or as a real marking on the verse?</b><span class="lean">Lean: quote line. It’s plain markdown, survives export, and needs no position bookkeeping in answers (the Sept 23 trap). A marking can come later.</span></li>
      <li><b>Crossway:</b> the finder shows one chapter, the same shape as the shipped chapter pane, so this adds no new exposure. The commercial-licence question in SCRIPTURE.md is unchanged, and it gets louder if rituals lead the paid campaign (D-030).</li>
      <li><b>Falsifier first?</b> <span class="mono">ritual_finished</span> reports <span class="mono">{movements, answered}</span>. A beta of these two practices on alpha answers “does keeping the passage in view carry people past movement one?” faster than any more prototyping.</li>
    </ol></div>
  </div></div>`;
}

/* ═══ RENDER ═══════════════════════════════════════════════════════════ */
function render() {
  applyTheme();
  renderBar(); renderNote();
  const sc = scene();
  const st = $('#stage');
  if (sc === 'find' && !P().passage) S.practice = 'lectio';
  st.innerHTML = sc === 'library' ? vLibrary() : sc === 'find' ? vFind() : sc === 'walk' ? vWalk() : sc === 'phone' ? vPhone() : sc === 'edge' ? vEdge() : sc === 'record' ? vRecord() : vIntro();
  if (sc === 'find') {
    renderResults();
    const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  }
  if (sc === 'walk' && ui.widen) setTimeout(() => { ui.widen = false; }, 1000);
  if (sc === 'library' && S.libq) { const q = $('#libq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  if (sc === 'walk') {
    const ta = document.querySelector('.page textarea');
    if (ta && ui.focus !== false) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); autosize(ta); }
  }
}
function autosize(ta) { if (!ta) return; }

window.addEventListener('hashchange', () => { ui.confirm = false; ui.fold = null; ui.about = false; ui.thresh = null; render(); document.getElementById('stage').firstElementChild?.scrollTo?.(0, 0); });

/* ── events ── */
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { S.fq = t.value; S.fch = null; S.fsel = null; if (!t.value.trim()) S.fbook = null; save(); renderResults(); return; }
  if (t.id === 'libq') {
    S.libq = t.value; save();
    $('#libgrid').innerHTML = libGridHTML();
    document.querySelectorAll('.libctl .pfilter').forEach((b) => { b.dataset.on = !S.libq.trim() && (b.dataset.act === 'scripture-only' ? S.scriptureOnly : !S.scriptureOnly && S.rhythm === b.dataset.v); });
    return;
  }
  if (t.dataset.ans != null) {
    S.answers[ansKey(+t.dataset.ans)] = t.value; save();
    document.querySelector('.v-face')?.classList.add('typing');
    if (S.layout === 'above') {
      const pb = document.querySelector('.pblock');
      const k = curKind();
      if (pb && k !== 'read' && k !== 'mark' && ui.fold == null && t.value.length > 0 && !pb.classList.contains('folded')) { ui.fold = true; ui.focus = true; render(); }
    }
    return;
  }
  if (t.dataset.act === 'typecatch') { S.typedCatch[S.practice] = t.value; save(); return; }
  if (t.id === 'slash-ta') {
    slash.text = t.value;
    if (t.value.endsWith('/')) { slash.text = t.value.slice(0, -1); slash.open = true; render(); }
  }
});
let lastMove = 0;
document.addEventListener('mousemove', (e) => {
  const f = document.querySelector('.v-face.typing');
  if (!f) return;
  const d = Math.abs(e.movementX) + Math.abs(e.movementY);
  if (d > 6) f.classList.remove('typing');
});
document.addEventListener('keydown', (e) => {
  const sc = scene();
  if (sc === 'find' && e.target.id === 'q') {
    const rows = [...document.querySelectorAll('#results .row')];
    if (e.key === 'ArrowDown' && rows.length) { e.preventDefault(); ui.kb = Math.min(rows.length - 1, ui.kb + 1); markKb(); return; }
    if (e.key === 'ArrowUp' && rows.length) { e.preventDefault(); ui.kb = Math.max(0, ui.kb - 1); markKb(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (S.fch) { begin(); return; }
      const r = rows[ui.kb]; if (r) r.click();
      return;
    }
  }
  if (e.key === 'Escape') {
    if (ui.about) { ui.about = false; render(); return; }
    if (ui.thresh) { ui.thresh = null; render(); return; }
    if (ui.confirm) { ui.confirm = false; render(); return; }
    if (slash.open) { slash.open = false; render(); return; }
    if (sc === 'find') { if (S.fch) { S.fch = null; S.fsel = null; save(); renderResults(); } else { S.changing = false; save(); location.hash = S.passage[S.practice] ? 'walk' : 'intro'; } return; }
    if (sc === 'walk') { location.hash = 'record'; return; }
  }
  if (sc === 'walk' && e.key === 'Enter' && e.altKey) { e.preventDefault(); next(); }
});
function next() {
  const pr = P(), k = S.practice;
  if (S.finished[k]) return;
  if (S.step[k] >= pr.moves.length - 1) S.finished[k] = true; else S.step[k]++;
  ui.fold = null; save(); render();
}

/* catching a word: click or drag within one verse */
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const w = e.target.closest('.psg[data-kind="mark"] .w');
  if (w && scene() !== 'phone') { drag = { v: +w.dataset.v, a: +w.dataset.i, b: +w.dataset.i, el: w.closest('.psg') }; paintDrag(); e.preventDefault(); }
});
document.addEventListener('pointerover', (e) => {
  if (!drag) return;
  const w = e.target.closest('.w');
  if (w && +w.dataset.v === drag.v) { drag.b = +w.dataset.i; paintDrag(); }
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const { v, a, b } = drag; drag = null;
  S.caught[S.practice] = { v, a: Math.min(a, b), b: Math.max(a, b) }; save(); ui.focus = true; render();
});
function paintDrag() {
  drag.el.querySelectorAll('.w.pre').forEach((x) => x.classList.remove('pre'));
  const lo = Math.min(drag.a, drag.b), hi = Math.max(drag.a, drag.b);
  drag.el.querySelectorAll(`.w[data-v="${drag.v}"]`).forEach((x) => { const i = +x.dataset.i; if (i >= lo && i <= hi) x.classList.add('pre'); });
}

document.addEventListener('click', (e) => {
  const sc = scene();
  // choose verses in the finder
  const rv = e.target.closest('.reading-view .vs');
  const rsec = e.target.closest('.reading-view .sec');
  if (rsec) { const secs = SECTIONS[corpusKey(S.fch.book, S.fch.chapter)]; const i = secs.findIndex(([n]) => n === +rsec.dataset.sec); const to = secs[i + 1] ? secs[i + 1][0] - 1 : lastVerse(S.fch.book, S.fch.chapter); S.fsel = { from: +rsec.dataset.sec, to }; save(); renderResults(); return; }
  if (rv) {
    const n = +rv.dataset.n, s = S.fsel;
    if (!s || (!e.shiftKey && s.from !== s.to) ) S.fsel = { from: n, to: n };
    else if (s.from === s.to && s.from === n) S.fsel = null;
    else S.fsel = { from: Math.min(s.from, n), to: Math.max(s.to, n) };
    if (s && s.from === s.to && s.from !== n && !e.shiftKey) S.fsel = { from: Math.min(s.from, n), to: Math.max(s.from, n) };
    save(); const y = $('#find-scroll').scrollTop; renderResults(); $('#find-scroll').scrollTop = y; return;
  }
  // cite a verse into the answer
  const vn = e.target.closest('.psg[data-kind="cite"] .vn');
  if (vn) {
    const n = +vn.dataset.n; const v = inRange(passage()).find(([x]) => x === n);
    const ta = document.querySelector('.page textarea');
    if (v && ta) {
      const ins = `“${v[1].replace(/^[“"]|[”"]$/g, '').replace(/“/g, '‘').replace(/”/g, '’')}” (v. ${n}) `;
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos), after = ta.value.slice(pos);
      ta.value = before + (before && !/\s$/.test(before) ? ' ' : '') + ins + after;
      S.answers[ansKey(S.step[S.practice])] = ta.value; save(); ui.focus = true; render();
    }
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act, v = a.dataset.v;
  switch (act) {
    case 'theme': S.theme = isDark() ? 'light' : 'dark'; save(); render(); break;
    case 'reset': { const th = S.theme; S = fresh(); S.theme = th; save(); slash = { open: false, text: 'He is not asleep to it. ', xref: null, quote: null }; location.hash = 'intro'; render(); break; }
    case 'note': S.noteMin = !S.noteMin; save(); renderNote(); break;
    case 'practice': S.practice = v; S.fch = null; S.fsel = null; ui.about = false; save(); render(); break;
    case 'layout': S.layout = v; ui.fold = null; save(); render(); break;
    case 'own': S.ownBible = !S.ownBible; save(); render(); break;
    case 'begin-practice': ui.thresh = null; S.practice = v; S.fq = ''; S.fch = null; S.fsel = null; S.fbook = null; S.changing = false; save(); location.hash = 'find'; break;
    case 'pick-book': S.fbook = a.dataset.b; S.fq = a.dataset.b; S.fch = null; save(); { const q = $('#q'); if (q) q.value = S.fq; } renderResults(); break;
    case 'open-ref': openRef(a.dataset.b, +a.dataset.c, a.dataset.f ? +a.dataset.f : null, a.dataset.t ? +a.dataset.t : null); break;
    case 'find-back': S.fch = null; S.fsel = null; S.fq = S.fbook || ''; save(); { const q = $('#q'); if (q) q.value = S.fq; } renderResults(); break;
    case 'sel-section': { const secs = SECTIONS[corpusKey(S.fch.book, S.fch.chapter)] || []; const n = S.fsel.from; let from = 1, to = lastVerse(S.fch.book, S.fch.chapter); secs.forEach(([s], i) => { if (s <= n) { from = s; to = secs[i + 1] ? secs[i + 1][0] - 1 : to; } }); S.fsel = { from, to }; save(); renderResults(); break; }
    case 'begin': begin(false); break;
    case 'own-ref': begin(true); break;
    case 'leave-find': e.preventDefault(); S.changing = false; save(); location.hash = S.passage[S.practice] ? 'walk' : 'intro'; break;
    case 'next': next(); break;
    case 'about': ui.about = true; render(); break;
    case 'about-close': ui.about = false; render(); break;
    case 'rhythm': S.rhythm = v; S.scriptureOnly = false; S.libq = ''; save(); render(); break;
    case 'scripture-only': S.scriptureOnly = !S.scriptureOnly; S.libq = ''; if (!S.scriptureOnly) S.rhythm = 'all'; save(); render(); break;
    case 'lib-open': ui.thresh = v; render(); break;
    case 'lib-close': ui.thresh = null; render(); break;
    case 'begin-plain': ui.thresh = null; S.practice = v; S.step[v] = 0; S.finished[v] = false; save(); location.hash = 'walk'; break;
    case 'goto': if (v !== '' && v != null) { S.step[S.practice] = +v; S.finished[S.practice] = false; ui.fold = null; save(); render(); } break;
    case 'uncatch': S.caught[S.practice] = null; save(); render(); break;
    case 'change': {
      const any = P().moves.some((_, i) => answer(i)) || caughtText();
      if (any) { ui.confirm = true; render(); } else { S.changing = true; S.fq = ''; S.fch = null; save(); location.hash = 'find'; }
      break;
    }
    case 'confirm-no': ui.confirm = false; render(); break;
    case 'confirm-yes': ui.confirm = false; S.changing = true; S.fq = ''; S.fch = null; save(); location.hash = 'find'; break;
    case 'slow': { const ps = document.querySelector('.leaf .psg, .pblock .psg'); if (ps) { ps.classList.remove('reading'); void ps.offsetWidth; ps.classList.add('reading'); } break; }
    case 'fold': ui.fold = true; ui.focus = false; render(); break;
    case 'unfold': ui.fold = false; ui.focus = false; render(); break;
    case 'after': location.hash = 'record'; break;
    case 'sl-open': slash.open = true; render(); break;
    case 'sl-quote': { const pd = S.passage.dbs || PRACTICES.dbs.fallback; slash.quote = inRange(pd).find(([n]) => n === +v); slash.open = false; render(); break; }
    case 'sl-xref': { const t = (CORPUS['Psalm 23'].find(([n]) => n === 4) || [0, ''])[1]; slash.xref = { ref: 'Psalm 23:4', text: t }; slash.open = false; render(); break; }
    case 'sl-search': case 'sl-change': slash.open = false; S.practice = 'dbs'; S.changing = act === 'sl-change'; S.fq = ''; S.fch = null; save(); location.hash = 'find'; break;
    case 'try-change': { S.practice = 'lectio'; if (!S.passage.lectio) S.passage.lectio = PRACTICES.lectio.fallback; if (!answer(1)) S.answers['lectio:1'] = 'The word keeps coming back.'; S.step.lectio = Math.max(1, S.step.lectio); S.ownBible = false; save(); location.hash = 'walk'; setTimeout(() => { ui.confirm = true; render(); }, 60); break; }
    case 'try-long': S.practice = 'lectio'; S.fq = 'John 15'; save(); location.hash = 'find'; setTimeout(() => { openRef('John', 15, 1, 27); }, 30); break;
    case 'try-one': S.practice = 'dbs'; save(); location.hash = 'find'; setTimeout(() => { openRef('Mark', 4, 39, 39); }, 30); break;
    case 'try-own': S.ownBible = true; S.practice = 'lectio'; if (!S.passage.lectio) S.passage.lectio = PRACTICES.lectio.fallback; S.step.lectio = 1; S.finished.lectio = false; save(); location.hash = 'walk'; break;
    case 'try-typo': S.fq = 'jhon 15'; S.fch = null; S.fbook = null; save(); location.hash = 'find'; break;
    case 'try-been': S.practice = 'lectio'; save(); location.hash = 'find'; setTimeout(() => { openRef('John', 15, 4, 5); }, 30); break;
  }
});
render();
</script>
