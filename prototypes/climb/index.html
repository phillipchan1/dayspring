<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One mountain</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg0: #f6efe4; --bg1: #fbe6c8;
    --ink: #2a2118; --ink-rgb: 42, 33, 24;
    --gold: #c4913c; --gold-rgb: 196, 145, 60;
    --rock-top: #a89ca8; --rock-bot: #efdfca;
    --far1: #efe0cc; --far2: #e6d2bd;
    --trail: rgba(42, 33, 24, 0.28);
    --panel: rgba(255, 255, 255, 0.35);
  }
  :root[data-theme='dark'] {
    --bg0: #10131e; --bg1: #2a2233;
    --ink: #efe6d8; --ink-rgb: 239, 230, 216;
    --gold: #e0ad5c; --gold-rgb: 224, 173, 92;
    --rock-top: #4a4257; --rock-bot: #1f1c2a;
    --far1: #241f30; --far2: #2d2638;
    --trail: rgba(239, 230, 216, 0.28);
    --panel: rgba(255, 255, 255, 0.03);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: linear-gradient(180deg, var(--bg0), var(--bg1));
    font-family: Inter, system-ui, sans-serif;
    transition: background 0.6s;
  }
  .page { display: grid; grid-template-columns: 170px 1fr; min-height: 100vh; }
  @media (max-width: 720px) { .page { grid-template-columns: 1fr; } .rail { display: none !important; } }

  /* the climb rail */
  .rail { position: sticky; top: 0; height: 100vh; padding: 60px 0 60px 36px; }
  .rail__track { position: relative; height: 100%; border-left: 2px solid rgba(var(--gold-rgb), 0.35); }
  .rail__fill { position: absolute; left: -2px; bottom: 0; width: 2px; background: var(--gold); transition: height 0.9s cubic-bezier(.6,0,.2,1); }
  .station { position: absolute; left: -9px; display: flex; align-items: center; gap: 10px; transform: translateY(50%); border: 0; background: none; cursor: pointer; color: inherit; padding: 0; text-align: left; }
  .station i { width: 16px; height: 16px; border-radius: 50%; background: var(--bg0); border: 2px solid rgba(var(--gold-rgb), 0.6); transition: all .3s; }
  .station.on i { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 5px rgba(var(--gold-rgb), .2); }
  .station span { display: flex; flex-direction: column; font-family: 'EB Garamond', serif; font-size: 16px; opacity: .55; }
  .station.on span { opacity: 1; }
  .station em { font-style: normal; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }

  main { padding: 48px clamp(16px, 5vw, 64px) 80px; max-width: 1180px; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 34px; font-size: 12px; }
  .tools label { display: flex; gap: 6px; align-items: center; opacity: .75; }
  .tools input[type=date] { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(var(--ink-rgb), .2); background: var(--panel); color: inherit; }
  .seg { display: inline-flex; border: 1px solid rgba(var(--ink-rgb), .2); border-radius: 999px; overflow: hidden; }
  .seg button { font: inherit; border: 0; background: none; color: inherit; padding: 5px 12px; cursor: pointer; opacity: .6; }
  .seg button[aria-pressed=true] { background: rgba(var(--gold-rgb), .2); opacity: 1; }
  .levels { display: none; }
  @media (max-width: 720px) { .levels { display: inline-flex; } }

  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
  h1 { margin: 10px 0 6px; font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400; font-size: clamp(30px, 4vw, 42px); }
  .line { margin: 0 0 26px; font-family: 'EB Garamond', serif; font-style: italic; font-size: 18px; opacity: .6; max-width: 640px; }

  /* the mountain */
  .scene { position: relative; border-radius: 18px; overflow: hidden; }
  .scene svg { display: block; width: 100%; }
  .scene .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: rgba(var(--ink-rgb), .5); }
  .scene .lbl.now { fill: var(--gold); }
  .scene .lbl.big { font-size: 11px; letter-spacing: .04em; }
  .scene .stone { cursor: pointer; }
  .note { margin: 14px 0 0; font-family: 'EB Garamond', serif; font-style: italic; font-size: 18px; opacity: .7; }
  .card { margin-top: 16px; padding: 16px 20px; border-radius: 12px; background: var(--panel); border: 1px solid rgba(var(--gold-rgb), .35); font-family: 'EB Garamond', serif; font-size: 17px; max-width: 640px; }
  .card small { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .card p { margin: 0 0 12px; }

  /* the flat strip, for comparison */
  .strip { margin-top: 30px; }
  .strip__cells, .strip__labels { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; }
  .strip__cells span { height: 5px; border-radius: 3px; }
  .strip__cells .past { background: var(--gold); }
  .strip__cells .now { background: linear-gradient(90deg, var(--gold) 50%, rgba(var(--gold-rgb), .25) 50%); }
  .strip__cells .future { border: 1px dashed rgba(var(--gold-rgb), .5); }
  .strip__labels { margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; text-align: center; opacity: .45; }
  .strip__labels .now { color: var(--gold); opacity: 1; }
  .strip-cap { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .4; margin-bottom: 10px; }

  .body { margin-top: 44px; opacity: .35; font-family: 'EB Garamond', serif; font-size: 17px; border-top: 1px solid rgba(var(--ink-rgb), .12); padding-top: 22px; }
</style>
</head>
<body>
<div class="page">
  <nav class="rail" aria-label="Altitude"><div class="rail__track" id="rail"><div class="rail__fill" id="railFill"></div></div></nav>
  <main>
    <div class="tools">
      <div class="seg levels" id="levelsSeg"></div>
      <label>Pretend today is <input type="date" id="today" value="2026-09-21" /></label>
      <div class="seg" id="compareSeg">
        <button data-v="mountain" aria-pressed="true">Mountain</button>
        <button data-v="both" aria-pressed="false">+ flat strip</button>
      </div>
      <div class="seg" id="themeSeg">
        <button data-v="light" aria-pressed="true">Dawn</button>
        <button data-v="dark" aria-pressed="false">Night</button>
      </div>
    </div>

    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="line" id="line"></p>

    <div class="scene" id="scene"></div>
    <p class="note" id="note"></p>
    <div id="card"></div>

    <div class="strip" id="strip" hidden></div>

    <div class="body" id="body"></div>
  </main>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────
   ONE MOUNTAIN. The whole year is one climb: Jan 1 at the foot, Dec 31 at the
   peak. Each step up the rail pulls the camera back — the week is the ground
   at your feet, the year is the whole mountain. The dot moves because a day
   passed, never because you wrote (no streak). Stones are the only marks you
   make: a prayer met by a later moment, set on the day it was met.
   ───────────────────────────────────────────────────────────────────────── */

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December']
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
const DAYSL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']

const LEVELS = [
  { key: 'week', eyebrow: 'Week', title: 'Standing in the days.', line: 'Just your pages, in the order you lived them.' },
  { key: 'month', eyebrow: 'Month', title: 'What’s alive right now.', line: 'Step back a month: what you’ve been carrying, who was new, the photos.' },
  { key: 'season', eyebrow: 'Season', title: 'What moved this season.', line: 'What began, what came back, what carried through, what went quiet.' },
  { key: 'year', eyebrow: 'Year', title: 'Looking back down the year.', line: 'The threads you kept returning to, in your own words.' },
]

const STONES = [
  { date: '2026-03-19', asked: '2026-03-12', ask: 'Pray for Dad’s tests.', later: 'Isaiah 43:2 this morning over Dad. When you pass through the waters I will be with you.' },
  { date: '2026-05-02', asked: '2026-04-06', ask: 'Show me whether to stay at the church.', later: 'Stayed after the service and talked with Tom. I think I know.' },
  { date: '2026-08-14', asked: '2026-07-29', ask: 'Lord, give Meg rest.', later: 'Meg slept the whole night. First time in weeks.' },
  { date: '2026-09-16', asked: '2026-09-02', ask: 'Help me forgive him.', later: 'Called him. Didn’t fix it, but I meant it.' },
]

// ── dates ────────────────────────────────────────────────────────────────
const D = (s) => new Date(s + 'T00:00:00Z')
const iso = (d) => d.toISOString().slice(0, 10)
const add = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d) }
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate()
const short = (s) => `${MON[+s.slice(5,7)-1]} ${+s.slice(8,10)}`
const ord = (n) => { const t = n % 100; if (t >= 11 && t <= 13) return n + 'th'; return n + ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th') }

let YEAR = 2026
/** Days since Jan 1 of the climb's year, as a fraction — the one axis. */
function tOf(s) {
  const y0 = Date.UTC(YEAR, 0, 1), y1 = Date.UTC(YEAR + 1, 0, 1)
  return (D(s).getTime() - y0) / (y1 - y0)
}

function periodOf(level, today) {
  const y = +today.slice(0,4), m = +today.slice(5,7)
  if (level === 'week') {
    const back = (D(today).getUTCDay() + 6) % 7
    const from = add(today, -back), to = add(from, 6)
    const label = from.slice(5,7) === to.slice(5,7) ? `${short(from)} – ${+to.slice(8,10)}` : `${short(from)} – ${short(to)}`
    return { from, to, label, name: 'This week' }
  }
  if (level === 'month') {
    const from = `${today.slice(0,7)}-01`, to = `${today.slice(0,7)}-${dim(y, m)}`
    return { from, to, label: MONL[m-1], name: MONL[m-1] }
  }
  if (level === 'season') {
    const sm = m === 12 || m <= 2 ? 12 : m <= 5 ? 3 : m <= 8 ? 6 : 9
    const sy = m <= 2 ? y - 1 : y
    const em = (sm + 2 - 1) % 12 + 1, ey = sm === 12 ? sy + 1 : sy
    const name = { 12: 'Winter', 3: 'Spring', 6: 'Summer', 9: 'Fall' }[sm]
    const label = sm === 12 ? `${name} ${sy}–${String(sy+1).slice(2)}` : `${name} ${sy}`
    return { from: `${sy}-${String(sm).padStart(2,'0')}-01`, to: `${ey}-${String(em).padStart(2,'0')}-${dim(ey, em)}`, label, name, sm, sy }
  }
  return { from: `${y}-01-01`, to: `${y}-12-31`, label: String(y), name: String(y) }
}

function noteFor(level, today, p) {
  if (level === 'week') return `It’s ${DAYSL[(D(today).getUTCDay()+6)%7]}. This week is still being written — it closes Sunday, ${short(p.to)}.`
  if (level === 'month') return `It’s the ${ord(+today.slice(8,10))}. ${p.name} is still being written — it closes on the ${ord(+p.to.slice(8,10))}.`
  if (level === 'season') {
    const i = (+today.slice(5,7) - p.sm + 12) % 12
    return `It’s ${MONL[+today.slice(5,7)-1]}, the ${['first','second','last'][i]} month of ${p.name.toLowerCase()}. ${p.name} is still being written — it closes ${short(p.to)}.`
  }
  return `It’s ${MONL[+today.slice(5,7)-1]}. ${p.name} is still being written — it closes Dec 31, at the top.`
}

// ── the terrain ──────────────────────────────────────────────────────────
/** Elevation at t: flat ground before Jan 1, a long climb to the peak on
 *  Dec 31, the far side falling away after. Detail at every scale (season,
 *  month, week, day), amplitude proportional to wavelength — so each zoom
 *  has its own ground instead of a straight ruler. */
const WAVES = [
  { l: 0.25, a: 0.07, p: 0.7 },
  { l: 1 / 12, a: 0.13, p: 2.1 },
  { l: 1 / 52, a: 0.15, p: 4.2 },
  { l: 3 / 365, a: 0.12, p: 1.3 },
]
function elev(t) {
  let base
  if (t < 0) base = -0.02 * Math.tanh(-t * 8)
  else if (t <= 1) base = Math.pow(t, 1.18)
  else base = 1 - Math.pow(t - 1, 1.1) * 3.6
  const inClimb = t < 0 ? Math.max(0, 1 + t * 10) : t > 1 ? Math.max(0, 1 - (t - 1) * 10) : 1
  let d = 0
  for (const w of WAVES) d += w.a * w.l * Math.sin((2 * Math.PI * t) / w.l + w.p)
  return base + d * inClimb
}
/** Far ranges: parallax, drawn at screen scale so they never balloon. */
function farRidge(x, seed) {
  return 0.5 * Math.sin(x * 0.006 + seed) + 0.3 * Math.sin(x * 0.017 + seed * 2) + 0.2 * Math.sin(x * 0.041 + seed * 3)
}

// ── camera ───────────────────────────────────────────────────────────────
function cameraFor(level, today) {
  const p = periodOf(level, today)
  let a = tOf(p.from), b = tOf(add(p.to, 1))
  const span = b - a
  const pad = level === 'year' ? 0.07 : span * 0.22
  let t0 = a - pad, t1 = b + (level === 'year' ? 0.16 : pad)
  let lo = Infinity, hi = -Infinity
  for (let i = 0; i <= 120; i++) { const e = elev(t0 + (t1 - t0) * i / 120); lo = Math.min(lo, e); hi = Math.max(hi, e) }
  const r = Math.max(hi - lo, span * 0.25)
  return { t0, t1, y0: lo - r * (level === 'year' ? 0.08 : 0.55), y1: hi + r * (level === 'year' ? 0.32 : 0.55) }
}

// ── render ───────────────────────────────────────────────────────────────
const state = { level: 3, today: '2026-09-21', cam: null, open: null, compare: 'mountain' }
const scene = document.getElementById('scene')

function render() {
  const W = Math.max(320, scene.clientWidth)
  const H = W < 600 ? 220 : 280
  const { t0, t1, y0, y1 } = state.cam
  const X = (t) => ((t - t0) / (t1 - t0)) * W
  const Y = (e) => H - ((e - y0) / (y1 - y0)) * H
  const lvl = LEVELS[state.level].key
  const today = state.today
  const tNow = tOf(today) + 0.5 / 365
  const p = periodOf(lvl, today)
  const pa = tOf(p.from), pb = tOf(add(p.to, 1))

  // trail samples
  const N = 260
  const pts = []
  for (let i = 0; i <= N; i++) { const t = t0 + (t1 - t0) * i / N; pts.push([X(t), Y(elev(t))]) }
  const poly = (arr) => arr.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ')
  const seg = (a, b, dy = 0) => {
    const out = []
    const n = Math.max(2, Math.ceil(N * (b - a) / (t1 - t0)))
    for (let i = 0; i <= n; i++) { const t = a + (b - a) * i / n; out.push([X(t), Y(elev(t)) + dy]) }
    return out
  }
  const ridgeUp = 22 // the ridge line sits above the trail, in screen px
  const mountain = `0,${H} ${poly(pts.map(([x, y]) => [x, y - ridgeUp]))} ${W},${H}`

  // parallax ranges (move with the camera centre, but never scale)
  const cx = ((t0 + t1) / 2) * 4000
  const far = (seed, base, amp, par) => {
    const out = []
    for (let x = 0; x <= W; x += 8) out.push([x, H * base - amp * farRidge(x + cx * par, seed)])
    return `0,${H} ${poly(out)} ${W},${H}`
  }

  const clip = (a, b) => [Math.max(a, t0), Math.min(b, t1)]
  const [la, lb] = clip(-1, Math.min(tNow, 2))
  const [fa, fb] = clip(tNow, 1)

  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${p.label}: where you stand">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--rock-top)"/><stop offset="100%" stop-color="var(--rock-bot)"/></linearGradient>
    <radialGradient id="glow"><stop offset="0%" stop-color="var(--gold)" stop-opacity=".55"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/></radialGradient>
  </defs>
  <polygon points="${far(1.3, 0.42, 36, 0.15)}" fill="var(--far1)" opacity=".7"/>
  <polygon points="${far(4.1, 0.58, 30, 0.35)}" fill="var(--far2)" opacity=".7"/>
  <polygon points="${mountain}" fill="url(#rock)"/>`

  // this period, softly lit on the mountain so the zoom has a subject
  if (lvl !== 'year') {
    const [a, b] = clip(pa, pb)
    const band = seg(a, b, 0)
    s += `<polygon points="${X(a)},${H} ${poly(band.map(([x, y]) => [x, y - ridgeUp]))} ${X(b)},${H}" fill="var(--gold)" opacity=".07"/>`
  }

  // trail: all of it faint, the part behind you lit
  s += `<polyline points="${poly(seg(Math.max(t0, -0.2), Math.min(t1, 1)))}" fill="none" stroke="var(--trail)" stroke-width="1.4" stroke-dasharray="2 5"/>`
  if (lb > la) s += `<polyline points="${poly(seg(la, lb))}" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>`

  // ticks and labels, by level
  const tick = (t, label, cls = '', size = 4, below = 18) => {
    if (t < t0 || t > t1) return ''
    const x = X(t), y = Y(elev(t))
    return `<line x1="${x}" y1="${y - size}" x2="${x}" y2="${y + size}" stroke="rgba(var(--ink-rgb),.35)" stroke-width="1"/>` +
      (label ? `<text class="lbl ${cls}" x="${x}" y="${y + below}" text-anchor="middle">${label}</text>` : '')
  }
  const inP = (t) => t >= pa - 1e-9 && t < pb - 1e-9
  if (lvl === 'year') {
    for (let m = 0; m < 12; m++) {
      const d = `${YEAR}-${String(m + 1).padStart(2, '0')}-01`
      s += tick(tOf(d), MON[m], 'big')
    }
    // the peak — Dec 31, where the year closes
    const px = X(1), py = Y(elev(1)) - ridgeUp
    s += `<circle cx="${px}" cy="${py}" r="30" fill="url(#glow)" opacity="${0.35 + 0.65 * Math.min(1, tNow)}"/><circle cx="${px}" cy="${py}" r="4.5" fill="var(--gold)"/>`
    s += `<text class="lbl big" x="${px}" y="${py - 14}" text-anchor="middle">Dec 31</text>`
  } else if (lvl === 'season') {
    let d = p.from
    while (d <= p.to) { const dt = tOf(d); const first = d.endsWith('-01'); s += tick(dt, first ? MONL[+d.slice(5,7)-1] : '', 'big', first ? 6 : 2.5, 22); d = add(d, 7 - ((D(d).getUTCDay()+6)%7) || 7) }
    for (let m of [0,1,2]) { const mm = (p.sm - 1 + m) % 12 + 1, yy = p.sm === 12 && m > 0 ? p.sy + 1 : p.sy; s += tick(tOf(`${yy}-${String(mm).padStart(2,'0')}-01`), MONL[mm-1], 'big', 6, 22) }
  } else if (lvl === 'month') {
    const n = +p.to.slice(8, 10)
    for (let i = 1; i <= n; i++) {
      const d = `${p.from.slice(0, 8)}${String(i).padStart(2, '0')}`
      const lab = [1, 8, 15, 22, n].includes(i) ? String(i) : ''
      s += tick(tOf(d) + 0.5 / 365, lab, '', lab ? 4 : 2.5)
    }
  } else {
    // the week: seven stepping stones at your feet
    for (let i = 0; i < 7; i++) {
      const d = add(p.from, i)
      const t = tOf(d) + 0.5 / 365
      const x = X(t), y = Y(elev(t))
      const past = d < today, now = d === today
      s += `<ellipse cx="${x}" cy="${y + 2}" rx="${Math.min(34, W / 36)}" ry="7" fill="${past || now ? 'var(--gold)' : 'none'}" fill-opacity="${now ? .95 : .55}" stroke="${past || now ? 'none' : 'rgba(var(--gold-rgb),.6)'}" stroke-dasharray="3 3"/>`
      s += `<text class="lbl ${now ? 'now' : ''}" x="${x}" y="${y + 26}" text-anchor="middle">${now ? 'today' : DAYS[i]}</text>`
      s += `<text class="lbl" x="${x}" y="${y + 39}" text-anchor="middle" opacity=".6">${short(d)}</text>`
    }
  }

  // where this chapter closes: a small cairn at the period's last day
  if (lvl !== 'year') {
    const t = pb
    if (t >= t0 && t <= t1) {
      const x = X(t), y = Y(elev(t))
      s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - 34}" stroke="var(--gold)" stroke-width="1.2" opacity=".7"/>`
      s += `<path d="M${x},${y - 34} l14,5 l-14,5 z" fill="var(--gold)" opacity=".7"/>`
      s += `<text class="lbl big" x="${x}" y="${y - 42}" text-anchor="middle">closes ${short(p.to)}</text>`
    }
  }

  // stones — the only marks the writer makes
  STONES.forEach((st, i) => {
    const t = tOf(st.date) + 0.5 / 365
    if (t < t0 || t > t1 || st.date > today) return
    const x = X(t), y = Y(elev(t))
    const on = state.open === i
    s += `<g class="stone" data-i="${i}"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle cx="${x}" cy="${y}" r="${on ? 13 : 10}" fill="url(#glow)"/>` +
      `<circle cx="${x - 1.5}" cy="${y - 1.5}" r="3.2" fill="var(--gold)"/><circle cx="${x + 1.6}" cy="${y + 1.6}" r="3.6" fill="var(--gold)" opacity=".6"/><circle cx="${x}" cy="${y - 6}" r="2.2" fill="#fff7e8"/></g>`
  })

  // you are here
  if (tNow >= t0 && tNow <= t1) {
    const x = X(tNow), y = Y(elev(tNow))
    s += `<circle cx="${x}" cy="${y}" r="14" fill="url(#glow)"><animate attributeName="r" values="11;16;11" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="${x}" cy="${y}" r="5" fill="var(--gold)" stroke="#fff7e8" stroke-width="2"/>`
    if (lvl !== 'week') s += `<text class="lbl now big" x="${x}" y="${y - 16}" text-anchor="middle">you are here</text>`
  }

  s += `</svg>`
  scene.innerHTML = s
  scene.querySelectorAll('.stone').forEach((g) => g.addEventListener('click', () => { state.open = state.open === +g.dataset.i ? null : +g.dataset.i; render(); renderCard() }))
}

function renderCard() {
  const el = document.getElementById('card')
  const st = STONES[state.open]
  el.innerHTML = st ? `<div class="card"><small>you asked · ${short(st.asked)}</small><p>“${st.ask}”</p><small>later, this · ${short(st.date)}</small><p style="margin:0">“${st.later}”</p></div>` : ''
}

function renderStrip() {
  const el = document.getElementById('strip')
  el.hidden = state.compare !== 'both'
  if (el.hidden) return
  const lvl = LEVELS[state.level].key, today = state.today, p = periodOf(lvl, today)
  let cells = []
  if (lvl === 'week') cells = DAYS.map((l, i) => ({ k: add(p.from, i), l }))
  else if (lvl === 'month') { const n = +p.to.slice(8,10); cells = Array.from({ length: n }, (_, i) => ({ k: `${p.from.slice(0,8)}${String(i+1).padStart(2,'0')}`, l: [1,8,15,22,n].includes(i+1) ? String(i+1) : '' })) }
  else if (lvl === 'season') cells = [0,1,2].map((m) => { const mm = (p.sm - 1 + m) % 12 + 1; return { k: `${mm}`, l: MON[mm-1], m: mm } })
  else cells = MON.map((l, i) => ({ k: `${i+1}`, l, m: i + 1 }))
  const nowIx = cells.findIndex((c) => c.m ? c.m === +today.slice(5,7) : c.k === today)
  el.innerHTML = `<div class="strip-cap">the flat strip, for comparison</div><div class="strip__cells" style="--n:${cells.length}">${cells.map((c, i) => `<span class="${i < nowIx ? 'past' : i === nowIx ? 'now' : 'future'}"></span>`).join('')}</div><div class="strip__labels" style="--n:${cells.length}">${cells.map((c, i) => `<span class="${i === nowIx ? 'now' : ''}">${i === nowIx ? 'now' : c.l}</span>`).join('')}</div>`
}

function renderText() {
  const L = LEVELS[state.level], p = periodOf(L.key, state.today)
  document.getElementById('eyebrow').textContent = `${L.eyebrow} · ${p.label}`
  document.getElementById('title').textContent = L.title
  document.getElementById('line').textContent = L.line
  document.getElementById('note').textContent = noteFor(L.key, state.today, p)
  document.getElementById('body').textContent = `(the ${L.key}’s told-back content continues here — unchanged)`
  // rail
  const rail = document.getElementById('rail')
  rail.querySelectorAll('.station').forEach((b, i) => {
    b.classList.toggle('on', i === state.level)
    b.querySelector('b').textContent = periodOf(LEVELS[i].key, state.today).label
  })
  document.getElementById('railFill').style.height = `${(state.level / 3) * 100}%`
  document.querySelectorAll('#levelsSeg button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === state.level)))
}

// ── the zoom ─────────────────────────────────────────────────────────────
let anim = null
function goTo(level, instant) {
  state.level = level
  state.open = null
  renderText(); renderStrip(); renderCard()
  const target = cameraFor(LEVELS[level].key, state.today)
  if (instant || !state.cam) { state.cam = target; render(); return }
  const from = { ...state.cam }
  const start = performance.now(), dur = 950
  cancelAnimationFrame(anim)
  // zoom in log-width so it feels like a camera, not a slide
  const w0 = Math.log(from.t1 - from.t0), w1 = Math.log(target.t1 - target.t0)
  const c0 = (from.t0 + from.t1) / 2, c1 = (target.t0 + target.t1) / 2
  const h0 = Math.log(from.y1 - from.y0), h1 = Math.log(target.y1 - target.y0)
  const m0 = (from.y0 + from.y1) / 2, m1 = (target.y0 + target.y1) / 2
  const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
  const step = (now) => {
    const k = ease(Math.min(1, (now - start) / dur))
    const w = Math.exp(w0 + (w1 - w0) * k), c = c0 + (c1 - c0) * k
    const h = Math.exp(h0 + (h1 - h0) * k), m = m0 + (m1 - m0) * k
    state.cam = { t0: c - w / 2, t1: c + w / 2, y0: m - h / 2, y1: m + h / 2 }
    render()
    if (k < 1) anim = requestAnimationFrame(step)
  }
  anim = requestAnimationFrame(step)
}

// ── wiring ───────────────────────────────────────────────────────────────
const rail = document.getElementById('rail')
LEVELS.forEach((L, i) => {
  const b = document.createElement('button')
  b.className = 'station'
  b.style.bottom = `${(i / 3) * 100}%`
  b.innerHTML = `<i></i><span><em>${L.eyebrow}</em><b style="font-weight:400"></b></span>`
  b.addEventListener('click', () => goTo(i))
  rail.appendChild(b)
  const s = document.createElement('button')
  s.textContent = L.eyebrow
  s.addEventListener('click', () => goTo(i))
  document.getElementById('levelsSeg').appendChild(s)
})
document.getElementById('today').addEventListener('change', (e) => {
  if (!e.target.value) return
  state.today = e.target.value
  YEAR = +state.today.slice(0, 4)
  goTo(state.level, true)
})
document.querySelectorAll('#compareSeg button').forEach((b) => b.addEventListener('click', () => {
  state.compare = b.dataset.v
  document.querySelectorAll('#compareSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
  renderStrip()
}))
document.querySelectorAll('#themeSeg button').forEach((b) => b.addEventListener('click', () => {
  document.documentElement.dataset.theme = b.dataset.v
  document.querySelectorAll('#themeSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
}))
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return
  if (e.key === 'ArrowUp') goTo(Math.min(3, state.level + 1))
  if (e.key === 'ArrowDown') goTo(Math.max(0, state.level - 1))
})
new ResizeObserver(() => state.cam && render()).observe(scene)

const q = new URLSearchParams(location.search)
if (q.get('theme') === 'dark') document.querySelector('#themeSeg [data-v=dark]').click()
goTo(Math.max(0, LEVELS.findIndex((l) => l.key === (q.get('level') || 'year'))), true)
</script>
</body>
</html>
