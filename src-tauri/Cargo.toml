[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `devtools` feature: makes WebviewWindow::open_devtools() available in RELEASE
# builds too (it's otherwise debug-only), so the dev-mode ⌘⌥I Web Inspector
# compiles in `tauri build`. Without it the release build fails to compile.
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-purchases = "0.2"
# Face ID / Touch ID for the optional app lock. Mobile-only by design — the
# plugin has no desktop implementation, and macOS Touch ID would need a
# hand-written LocalAuthentication command. Mac and web use the PIN.
tauri-plugin-biometric = "2"

# Same objc2 major as iOS / wry — used to turn on WKWebView inline predictions
# before the view is created (see `native_typing.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Raw UIKit/ObjC access so the iOS webview can be told to stop insetting itself
# (see `reclaim_ios_viewport` in src/lib.rs). Versions match what wry 0.55.1
# already resolves, so this adds no second crate graph.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std",
  "UIApplication",
  "UIColor",
  "UIResponder",
  "UIScrollView",
  "UIView",
  "UIWindow",
] }
# NSNotificationCenter, to hear `applicationWillResignActive` — the moment iOS
# takes the app-switcher snapshot. See `install_privacy_screen` in src/lib.rs.
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSNotification",
  "NSOperation",
  "NSString",
] }
block2 = "0.6"
