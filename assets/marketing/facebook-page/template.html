<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dayspring Facebook Page cover</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="cover" aria-label="Dayspring Facebook Page cover photo">
      <div class="grain"></div>
      <div class="dawn dawn--right"></div>
      <div class="dawn dawn--left"></div>

      <svg class="sunrise" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="dawnGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f3bd76" />
            <stop offset="55%" stop-color="#e8917c" />
            <stop offset="100%" stop-color="#c56a6e" />
          </linearGradient>
        </defs>
        <path d="M5 17a7 7 0 0 1 14 0" fill="url(#dawnGrad)" />
        <g stroke="#f3bd76" stroke-width="1.1" stroke-linecap="round">
          <path d="M12 3v3" />
          <path d="M4.4 7.4l2.1 2.1" />
          <path d="M19.6 7.4l-2.1 2.1" />
          <path d="M2.5 17h19" />
        </g>
      </svg>

      <div class="safe">
        <header class="brand">
          <span class="mark" aria-hidden="true"></span>
          <span class="wordmark">Dayspring</span>
        </header>

        <section class="message">
          <h1>Journaling for <em>spiritual growth.</em></h1>
          <p class="supporting">
            Write freely. Over time, see what God has been making of you.
          </p>
          <p class="proof">usedayspring.app &middot; 14-day free trial</p>
        </section>
      </div>
    </main>
  </body>
</html>
