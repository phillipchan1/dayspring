<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="dawn" cx="50%" cy="118%" r="75%">
      <stop offset="0%" stop-color="#f3bd76" stop-opacity="0.5"/>
      <stop offset="28%" stop-color="#e8917c" stop-opacity="0.3"/>
      <stop offset="48%" stop-color="#c56a6e" stop-opacity="0.13"/>
      <stop offset="70%" stop-color="#0c0d11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="becoming" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3bd76"/>
      <stop offset="60%" stop-color="#e8917c"/>
      <stop offset="100%" stop-color="#c56a6e"/>
    </linearGradient>
    <radialGradient id="dot" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f3bd76"/>
      <stop offset="100%" stop-color="#c56a6e"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0c0d11"/>
  <ellipse cx="600" cy="700" rx="840" ry="520" fill="url(#dawn)"/>
  <line x1="120" y1="430" x2="1080" y2="430" stroke="#f3bd76" stroke-opacity="0.4" stroke-width="1"/>

  <!-- brand -->
  <g transform="translate(96, 92)">
    <circle cx="9" cy="9" r="9" fill="url(#dot)"/>
    <text x="30" y="17" font-family="Georgia, serif" font-size="30" fill="#ece7dd" letter-spacing="0.3">Dayspring</text>
  </g>

  <!-- headline -->
  <text x="96" y="300" font-family="Georgia, serif" font-weight="300" font-size="80" letter-spacing="-1.5" fill="#ece7dd">A journal built for</text>
  <text x="96" y="392" font-family="Georgia, serif" font-style="italic" font-size="80" letter-spacing="-1.5" fill="url(#becoming)">spiritual growth.</text>

  <!-- verse -->
  <text x="96" y="520" font-family="monospace" font-size="22" fill="#7a7986">&#8220;…the dayspring from on high hath visited us.&#8221; — Luke 1:78</text>
</svg>
