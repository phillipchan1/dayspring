<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <!-- Resolve the theme before first paint so light users don't flash a dark
         palette (and vice versa). Mirrors resolveTheme() in src/lib. -->
    <script>
      (function () {
        try {
          var LIGHT = { dawn: 1, vellum: 1, cloister: 1, sabbath: 1 }
          var DARK = { ink: 1, ember: 1, compline: 1, nocturne: 1 }
          var s = {}
          try { s = JSON.parse(localStorage.getItem('dayspring.settings.v1')) || {} } catch (e) {}
          var mode = s.appearance || 'auto'
          var light = LIGHT[s.lightTheme] ? s.lightTheme : 'dawn'
          var dark = DARK[s.darkTheme] ? s.darkTheme : 'ink'
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = mode === 'light' ? light : mode === 'dark' ? dark : prefersDark ? dark : light
          var appearance = LIGHT[theme] ? 'light' : 'dark'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.setAttribute('data-appearance', appearance)
          root.style.colorScheme = appearance
        } catch (e) {}
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1b1e27" />
    <!-- PWA: installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="application-name" content="Dayspring" />
    <meta name="apple-mobile-web-app-title" content="Dayspring" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Dayspring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
