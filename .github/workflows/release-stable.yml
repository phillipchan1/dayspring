name: Release stable (beta users)

# Runs on every push to the `stable` branch and on manual dispatch.
# Publishes to dayspring-releases as a pre-release (never --latest, so Phil's
# alpha channel at releases/latest/download/latest.json is unaffected) and
# commits stable-latest.json to the repo root so installed beta apps auto-update.
on:
  push:
    branches: [stable]
  workflow_dispatch:

concurrency:
  group: release-stable
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.diff.outputs.should_build }}
    steps:
      - name: Compare HEAD to last stable-built SHA
        id: diff
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          RELEASES_REPO="phillipchan1/dayspring-releases"
          LAST_SHA=$(gh api "repos/${RELEASES_REPO}/contents/stable-last-built-sha.txt" \
            --jq '.content' 2>/dev/null | base64 -d | tr -d '[:space:]' || echo "")
          CURRENT="${{ github.sha }}"
          echo "Last built : ${LAST_SHA:-<none>}"
          echo "Current    : $CURRENT"
          if [ "$LAST_SHA" = "$CURRENT" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No new commits — skipping build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New commits — will build."
          fi

  release:
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      RELEASES_REPO: phillipchan1/dayspring-releases
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stable
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compute version
        run: |
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.version='$VERSION';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building stable version $VERSION"

      - name: Patch updater endpoint to stable channel
        run: |
          # Beta users' installed apps poll this raw URL for updates.
          # Phil's alpha channel (releases/latest/download/latest.json) is untouched.
          STABLE_ENDPOINT="https://raw.githubusercontent.com/phillipchan1/dayspring-releases/main/stable-latest.json"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p));
            c.plugins.updater.endpoints = ['$STABLE_ENDPOINT'];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
          echo "Patched updater endpoint to stable channel"

      - name: Enable Apple signing when configured
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$IDENTITY" ] && [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.bundle.macOS.signingIdentity=process.env.IDENTITY;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
            echo "Apple signing identity set"
          else
            echo "Missing cert/password — building unsigned (ad-hoc)"
          fi

      - name: Generate release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "PUB_DATE=$PUB_DATE" >> "$GITHUB_ENV"
          BEFORE="${{ github.event.before }}"
          ZEROS="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZEROS" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            COMMITS=$(git log -1 --no-merges --pretty=format:'- %s')
          else
            COMMITS=$(git log "${BEFORE}..HEAD" --no-merges --pretty=format:'- %s')
          fi
          [ -z "$COMMITS" ] && COMMITS="- Minor improvements and behind-the-scenes fixes."
          printf '%s\n' "$COMMITS" | node scripts/release-notes.mjs > RELEASE_NOTES.md
          echo "Generated release notes:"; cat RELEASE_NOTES.md

      - name: Assemble bundled changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -uo pipefail
          node scripts/assemble-changelog.mjs
          echo "Bundled changelog:"; cat public/changelog.json

      - name: Build and sign the app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: https://dayspring-eosin.vercel.app
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -uo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "No Apple cert/password — building unsigned (ad-hoc)."
          else
            echo "Apple cert + password present — building signed + notarized."
          fi
          for attempt in 1 2 3; do
            echo "::group::tauri build (attempt $attempt)"
            if npm run tauri build -- --target universal-apple-darwin --verbose; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed — detaching stale volumes…"
            for vol in /Volumes/Dayspring*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force || true
            done
            sleep 5
          done
          echo "All build attempts failed"; exit 1

      - name: Publish to releases repo (pre-release, not --latest)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="stable-v${APP_VERSION}"
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"

          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          APPTAR=$(ls "$BUNDLE"/macos/*.app.tar.gz | head -1)
          SIG=$(cat "$BUNDLE"/macos/*.app.tar.gz.sig)
          APPTAR_NAME=$(basename "$APPTAR")
          ASSET_URL="https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${APPTAR_NAME}"

          cp "$DMG" "Dayspring-beta.dmg"

          # stable-latest.json is the endpoint baked into beta users' installed apps.
          jq -n \
            --arg v "$APP_VERSION" \
            --rawfile notes RELEASE_NOTES.md \
            --arg date "$PUB_DATE" \
            --arg sig "$SIG" \
            --arg url "$ASSET_URL" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{"darwin-aarch64":{signature:$sig, url:$url},"darwin-x86_64":{signature:$sig, url:$url}}}' \
            > stable-latest.json

          echo "Generated stable-latest.json:"; cat stable-latest.json

          # --prerelease keeps this out of "latest" so Phil's alpha endpoint is unaffected.
          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "Dayspring stable v${APP_VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            "$DMG" "Dayspring-beta.dmg" "$APPTAR" stable-latest.json

      - name: Commit stable-latest.json to releases repo root
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          # The raw URL https://raw.githubusercontent.com/.../main/stable-latest.json
          # is what beta users' Tauri updater polls. Committing the file to main
          # makes that URL always resolve to the freshest stable release.
          CONTENT=$(base64 < stable-latest.json)
          FILE_SHA=$(gh api "repos/${RELEASES_REPO}/contents/stable-latest.json" \
            --jq '.sha' 2>/dev/null || echo "")
          EXTRA_ARGS=()
          [ -n "$FILE_SHA" ] && EXTRA_ARGS+=(--field "sha=$FILE_SHA")
          gh api "repos/${RELEASES_REPO}/contents/stable-latest.json" \
            --method PUT \
            --field "message=stable release v${APP_VERSION}" \
            --field "content=$CONTENT" \
            "${EXTRA_ARGS[@]}"
          echo "Updated stable-latest.json in releases repo"

      - name: Record stable built SHA
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          CONTENT=$(printf '%s' '${{ github.sha }}' | base64)
          FILE_SHA=$(gh api "repos/${RELEASES_REPO}/contents/stable-last-built-sha.txt" \
            --jq '.sha' 2>/dev/null || echo "")
          EXTRA_ARGS=()
          [ -n "$FILE_SHA" ] && EXTRA_ARGS+=(--field "sha=$FILE_SHA")
          gh api "repos/${RELEASES_REPO}/contents/stable-last-built-sha.txt" \
            --method PUT \
            --field "message=Record stable built SHA ${{ github.sha }}" \
            --field "content=$CONTENT" \
            "${EXTRA_ARGS[@]}"
          echo "Recorded stable built SHA: ${{ github.sha }}"
