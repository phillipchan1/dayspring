# One-shot Supabase → Neon copy from a GitHub-hosted runner (the operator
# box drops Postgres connections; per-row inserts are too slow there).
# Manual only. Default is dry-run (counts). apply writes.
name: Migrate Neon

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run (read-only counts) or apply (copy)
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

concurrency:
  group: migrate-neon
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: setup-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - id: npm-ci
        run: npm ci
      - id: migrate
        env:
          SOURCE_PGHOST: ${{ secrets.MIGRATION_READER_HOST }}
          SOURCE_PGUSER: ${{ secrets.MIGRATION_READER_USER }}
          SOURCE_PGDATABASE: ${{ secrets.MIGRATION_READER_DB }}
          SOURCE_PGPASSWORD: ${{ secrets.MIGRATION_READER_PASSWORD }}
          TARGET_PGHOST: ${{ secrets.NEON_PROD_HOST }}
          TARGET_PGUSER: ${{ secrets.NEON_PROD_USER }}
          TARGET_PGDATABASE: ${{ secrets.NEON_PROD_DB }}
          TARGET_PGPASSWORD: ${{ secrets.NEON_PROD_PASSWORD }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/scripts/certs/supabase-prod-ca-2021.crt
        run: node scripts/migrate-neon.mjs --${{ inputs.mode }}
