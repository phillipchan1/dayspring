name: Publish support manifest

# Keeps the help site at usedayspring.app/help in step with the app.
#
# The manifest is every shortcut, slash command, setting default, palette,
# practice, importer, price and limit — read out of the modules that already own
# them. The help site consumes it at build time and FAILS its build if an
# article references a feature the manifest no longer has, so docs can't quietly
# rot.
#
# Two manifests, because the site needs to tell two things apart:
#
#   master → app-manifest.alpha.json   the full vocabulary of real feature ids
#   stable → app-manifest.json         what beta/production users actually have
#
# An article requiring an id in alpha but not stable is simply held back, and
# publishes itself the moment that feature merges down. An id in neither is an
# authoring error and breaks the site build.

on:
  push:
    branches: [master, stable]
    # Only when something the manifest reads could have changed. The generator
    # itself is included so a change to WHAT gets extracted also republishes.
    paths:
      - "src/features/shortcuts/shortcuts.ts"
      - "src/editor/slashCommands.ts"
      - "src/editor/practices/practicesData.ts"
      - "src/editor/attachmentInsert.ts"
      - "src/lib/settings.ts"
      - "src/lib/resolveTheme.ts"
      - "src/lib/highlightColors.ts"
      - "src/lib/import/sources.ts"
      - "src/lib/subscription.ts"
      - "src/lib/appleIap.ts"
      - "src/features/flags.tsx"
      - "src/features/paywall/prices.ts"
      - "src/features/capture/PageScanCapture.tsx"
      - "api/account/delete.ts"
      - "api/profile/ensure.ts"
      - "api/trial/extend.ts"
      - "scripts/export-support-manifest.ts"
      - ".github/workflows/support-manifest.yml"
  workflow_dispatch:

concurrency:
  # Serialise per branch: two runs pushing to the site repo at once would
  # conflict, and the later one is always the one we want.
  group: support-manifest-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Guards the extractors themselves: a refactor that silently stopped
      # finding a category would otherwise publish an empty reference table.
      - name: Test the generator
        run: npx vitest run scripts/export-support-manifest.test.ts

      - name: Generate the manifest
        run: npm run support:manifest -- --channel ${{ github.ref_name }} --out support-manifest.json

      # Publishing needs a token with contents:write on dayspring-site. Without
      # it, generate and test but skip the push, rather than failing every build
      # on master until someone adds a secret. The drift guard above still runs,
      # which is the part that catches real problems.
      - name: Can we publish?
        id: gate
        env:
          TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Manifest not published::SITE_REPO_TOKEN is not set, so the help site was not updated. The manifest generated and passed its tests. Add the secret to enable publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the help site
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: phillipchan1/dayspring-site
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Copy it into place
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "stable" ]; then
            target="src/content/generated/app-manifest.json"
          else
            target="src/content/generated/app-manifest.alpha.json"
          fi
          mkdir -p "site/$(dirname "$target")"
          cp support-manifest.json "site/$target"
          echo "target=$target" >> "$GITHUB_ENV"

      - name: Commit and push if it changed
        if: steps.gate.outputs.publish == 'true'
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "dayspring-bot"
          git config user.email "bot@usedayspring.app"

          if git diff --quiet -- "$target"; then
            echo "Manifest unchanged — nothing to publish."
            exit 0
          fi

          git add "$target"
          git commit -m "Update ${{ github.ref_name }} app manifest (${GITHUB_SHA::7})"
          # Rebase rather than force: the other branch's workflow may have
          # pushed the sibling manifest while this run was building.
          git pull --rebase origin master
          git push origin HEAD:master
          echo "Published. Vercel will rebuild the help site."
