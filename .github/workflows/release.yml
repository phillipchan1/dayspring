name: Release desktop app

# Every push to master produces a new signed macOS build and publishes it to the
# PUBLIC releases repo (phillipchan1/dayspring-releases), updating latest.json so
# installed apps auto-update. The source for this repo stays private.
on:
  schedule:
    - cron: "0 6 * * *"   # 2am ET — overnight, fresh build by morning
  workflow_dispatch:       # manual trigger anytime from GitHub Actions tab

concurrency:
  group: release-desktop
  cancel-in-progress: true

permissions:
  contents: write   # needed to push the version write-back commit

jobs:
  # Cheap pre-flight (Ubuntu, ~10s) — skips the macOS build when HEAD SHA
  # hasn't changed since the last successful build. Every new commit gets a
  # new version automatically (major.minor from package.json + run number).
  # Manual workflow_dispatch always bypasses this check.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.diff.outputs.should_build }}
    steps:
      - name: Compare HEAD to last-built SHA
        id: diff
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          RELEASES_REPO="phillipchan1/dayspring-releases"
          LAST_SHA=$(gh api "repos/${RELEASES_REPO}/contents/last-built-sha.txt" \
            --jq '.content' 2>/dev/null | base64 -d | tr -d '[:space:]' || echo "")
          CURRENT="${{ github.sha }}"
          echo "Last built : ${LAST_SHA:-<none>}"
          echo "Current    : $CURRENT"
          if [ "$LAST_SHA" = "$CURRENT" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No new commits — skipping build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New commits — will build."
          fi

  release:
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest # Apple Silicon runner
    env:
      RELEASES_REPO: phillipchan1/dayspring-releases
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the release-notes step can diff this build against
          # the previous tip of master (github.event.before..HEAD).
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        # Not `npm ci`: vite 8 / rolldown pulls platform-specific optional deps
        # (@emnapi/*) that differ across npm versions, so a strict lockfile check
        # is brittle here. `npm install` resolves them per-runner.
        run: npm install --no-audit --no-fund

      - name: Compute version (major.minor from package.json + run number as patch)
        run: |
          # major.minor comes from package.json; patch = CI run number so every
          # push produces a strictly-increasing version without any manual bump.
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          # Patch tauri.conf.json in-place (not committed — CI-only).
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.version='$VERSION';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      # When an Apple signing identity is configured, swap the ad-hoc "-" in
      # tauri.conf.json for the real identity so the build does Developer ID
      # signing + notarization. Without the secret, the ad-hoc value stays and
      # the build is unsigned (current behavior) — so this is safe pre-enrollment.
      # (secrets can't be used in `if:`, so we gate inside the script via env.)
      - name: Enable Apple signing when configured
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # All three must be present — if the cert password is missing, the
          # security import will fail and codesign can't find anything in the
          # keychain. Keep tauri.conf.json at "-" (ad-hoc) unless everything is ready.
          if [ -n "$IDENTITY" ] && [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.bundle.macOS.signingIdentity=process.env.IDENTITY;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
            echo "Apple signing identity set — build will sign + notarize"
          else
            echo "Missing cert, password, or identity — building unsigned (ad-hoc)"
          fi

      # Human-readable "what's new" for THIS build, generated from the commits in
      # this push (previous tip → now). Runs BEFORE the build so it can be bundled
      # into the changelog below; also feeds latest.json + the release body later.
      # Best-effort: scripts/release-notes.mjs falls back to a cleaned commit list
      # if OPENAI_API_KEY is unset or the API errors, so it never blocks a release.
      - name: Generate release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "PUB_DATE=$PUB_DATE" >> "$GITHUB_ENV"
          BEFORE="${{ github.event.before }}"
          ZEROS="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZEROS" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # First build / force-push / unreachable base: just describe the tip.
            COMMITS=$(git log -1 --no-merges --pretty=format:'- %s')
          else
            COMMITS=$(git log "${BEFORE}..HEAD" --no-merges --pretty=format:'- %s')
          fi
          [ -z "$COMMITS" ] && COMMITS="- Minor improvements and behind-the-scenes fixes."
          printf '%s\n' "$COMMITS" | node scripts/release-notes.mjs > RELEASE_NOTES.md
          echo "Generated release notes:"; cat RELEASE_NOTES.md

      # Assemble the cumulative changelog (prior GitHub releases + this build) into
      # public/changelog.json so Vite bundles it into the app. Runs BEFORE the
      # build. Best-effort: writes the current entry alone if the API is down.
      - name: Assemble bundled changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -uo pipefail
          node scripts/assemble-changelog.mjs
          echo "Bundled changelog:"; cat public/changelog.json

      # Build + sign directly (we publish to the public repo ourselves below).
      # The .dmg step (hdiutil/bundle_dmg.sh) is flaky on headless runners, so
      # we retry and clear any stale mount between attempts. --verbose surfaces
      # the real hdiutil error if it ever fails for good.
      - name: Build and sign the app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: https://dayspring-eosin.vercel.app
          # Updater signing (minisign) — unrelated to Apple code signing below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization. CRITICAL: these are gated
          # on APPLE_CERTIFICATE being non-empty. If we passed an empty string,
          # the Tauri CLI would see "env present" and try (and fail) to import an
          # empty cert — which broke every build. The `&&` makes the var absent
          # entirely (not "") when no cert is configured, so it falls back to the
          # ad-hoc signingIdentity "-" and builds unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -uo pipefail
          # Belt-and-suspenders: if no real cert is configured, fully unset every
          # APPLE_* var so the Tauri CLI never attempts (and fails) Apple signing.
          # An empty-string env var still triggers the import path, so unset wins.
          # Fall back to unsigned if either the cert OR its password is absent —
          # an empty password causes `security import` to fail with "wrong password".
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "No Apple cert/password — building unsigned (ad-hoc)."
          else
            echo "Apple cert + password present — building signed + notarized."
          fi
          for attempt in 1 2 3; do
            echo "::group::tauri build (attempt $attempt)"
            if npm run tauri build -- --target universal-apple-darwin --verbose; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed — detaching any stale Dayspring volumes and retrying…"
            for vol in /Volumes/Dayspring*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force || true
            done
            sleep 5
          done
          echo "All build attempts failed"; exit 1

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="app-v${APP_VERSION}"
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"

          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          APPTAR=$(ls "$BUNDLE"/macos/*.app.tar.gz | head -1)
          SIG=$(cat "$BUNDLE"/macos/*.app.tar.gz.sig)
          APPTAR_NAME=$(basename "$APPTAR")
          # PUB_DATE is set earlier (Generate release notes step) and shared via env.
          ASSET_URL="https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${APPTAR_NAME}"

          # Stable-named copies of the .dmg so the marketing site can always link to
          # a fixed URL. Both names point to the same universal binary.
          STABLE_DMG="Dayspring.dmg"
          STABLE_DMG_AARCH64="Dayspring-aarch64.dmg"  # keep for existing links
          cp "$DMG" "$STABLE_DMG"
          cp "$DMG" "$STABLE_DMG_AARCH64"

          # Updater manifest the app polls. Both platform keys point to the same
          # universal binary so Intel and Apple Silicon users both auto-update.
          jq -n \
            --arg v "$APP_VERSION" \
            --rawfile notes RELEASE_NOTES.md \
            --arg date "$PUB_DATE" \
            --arg sig "$SIG" \
            --arg url "$ASSET_URL" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{"darwin-aarch64":{signature:$sig, url:$url},"darwin-x86_64":{signature:$sig, url:$url}}}' \
            > latest.json

          echo "Generated latest.json:"; cat latest.json

          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "Dayspring v${APP_VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            "$DMG" "$STABLE_DMG" "$STABLE_DMG_AARCH64" "$APPTAR" latest.json

      - name: Record built SHA (skips next scheduled build if no new commits)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          CONTENT=$(printf '%s' '${{ github.sha }}' | base64)
          # Fetch the current file SHA so we can update (not re-create) the file.
          FILE_SHA=$(gh api "repos/${RELEASES_REPO}/contents/last-built-sha.txt" \
            --jq '.sha' 2>/dev/null || echo "")
          EXTRA_ARGS=()
          [ -n "$FILE_SHA" ] && EXTRA_ARGS+=(--field "sha=$FILE_SHA")
          gh api "repos/${RELEASES_REPO}/contents/last-built-sha.txt" \
            --method PUT \
            --field "message=Record built SHA ${{ github.sha }}" \
            --field "content=$CONTENT" \
            "${EXTRA_ARGS[@]}"
          echo "Recorded built SHA: ${{ github.sha }}"

      - name: Write version back to package.json
        # Keeps package.json in sync with the version that actually shipped.
        # The [skip ci] tag prevents this commit from triggering another build.
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(p));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          # Only commit if there's actually a change (first run at this version would be new).
          if git diff --cached --quiet; then
            echo "package.json already at $APP_VERSION — no write-back needed."
          else
            git commit -m "chore: sync version to $APP_VERSION [skip ci]"
            git push
            echo "Wrote version $APP_VERSION back to package.json."
          fi
