name: Release desktop app

# Every push to master produces a new signed macOS build and publishes it to the
# PUBLIC releases repo (phillipchan1/dayspring-releases), updating latest.json so
# installed apps auto-update. The source for this repo stays private.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest # Apple Silicon runner
    env:
      RELEASES_REPO: phillipchan1/dayspring-releases
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        # Not `npm ci`: vite 8 / rolldown pulls platform-specific optional deps
        # (@emnapi/*) that differ across npm versions, so a strict lockfile check
        # is brittle here. `npm install` resolves them per-runner.
        run: npm install --no-audit --no-fund

      - name: Compute version (0.1.<run number>)
        run: |
          VERSION="0.1.${{ github.run_number }}"
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.version='$VERSION';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      # When an Apple signing identity is configured, swap the ad-hoc "-" in
      # tauri.conf.json for the real identity so the build does Developer ID
      # signing + notarization. Without the secret, the ad-hoc value stays and
      # the build is unsigned (current behavior) — so this is safe pre-enrollment.
      # (secrets can't be used in `if:`, so we gate inside the script via env.)
      - name: Enable Apple signing when configured
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$IDENTITY" ]; then
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.bundle.macOS.signingIdentity=process.env.IDENTITY;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
            echo "Apple signing identity set — build will sign + notarize"
          else
            echo "No Apple identity configured — building unsigned (ad-hoc)"
          fi

      # Build + sign directly (we publish to the public repo ourselves below).
      # The .dmg step (hdiutil/bundle_dmg.sh) is flaky on headless runners, so
      # we retry and clear any stale mount between attempts. --verbose surfaces
      # the real hdiutil error if it ever fails for good.
      - name: Build and sign the app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: https://dayspring-eosin.vercel.app
          # Updater signing (minisign) — unrelated to Apple code signing below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization. CRITICAL: these are gated
          # on APPLE_CERTIFICATE being non-empty. If we passed an empty string,
          # the Tauri CLI would see "env present" and try (and fail) to import an
          # empty cert — which broke every build. The `&&` makes the var absent
          # entirely (not "") when no cert is configured, so it falls back to the
          # ad-hoc signingIdentity "-" and builds unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -uo pipefail
          # Belt-and-suspenders: if no real cert is configured, fully unset every
          # APPLE_* var so the Tauri CLI never attempts (and fails) Apple signing.
          # An empty-string env var still triggers the import path, so unset wins.
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "No Apple cert — building unsigned (ad-hoc)."
          else
            echo "Apple cert present — building signed + notarized."
          fi
          for attempt in 1 2 3; do
            echo "::group::tauri build (attempt $attempt)"
            if npm run tauri build -- --target aarch64-apple-darwin --verbose; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed — detaching any stale Dayspring volumes and retrying…"
            for vol in /Volumes/Dayspring*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force || true
            done
            sleep 5
          done
          echo "All build attempts failed"; exit 1

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="app-v${APP_VERSION}"
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"

          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          APPTAR=$(ls "$BUNDLE"/macos/*.app.tar.gz | head -1)
          SIG=$(cat "$BUNDLE"/macos/*.app.tar.gz.sig)
          APPTAR_NAME=$(basename "$APPTAR")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ASSET_URL="https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${APPTAR_NAME}"

          # Stable-named copy of the .dmg so the marketing site can always link to
          # releases/latest/download/Dayspring-aarch64.dmg (no version in the URL).
          STABLE_DMG="Dayspring-aarch64.dmg"
          cp "$DMG" "$STABLE_DMG"

          # Updater manifest the app polls. Tauri verifies `signature` against the
          # embedded public key before installing.
          jq -n \
            --arg v "$APP_VERSION" \
            --arg notes "Automated build from ${{ github.sha }}" \
            --arg date "$PUB_DATE" \
            --arg sig "$SIG" \
            --arg url "$ASSET_URL" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{"darwin-aarch64":{signature:$sig, url:$url}}}' \
            > latest.json

          echo "Generated latest.json:"; cat latest.json

          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "Dayspring v${APP_VERSION}" \
            --notes "Automated build from ${{ github.sha }}. Installed apps auto-update to this version." \
            --latest \
            "$DMG" "$STABLE_DMG" "$APPTAR" latest.json
