# One-shot: copy the OPENAI_API_KEY repo secret onto the production Worker
# (POST /api/transcribe calls OpenAI directly; there is no ZDR speech-to-text).
# Manual only. The key goes to wrangler on stdin; it is never echoed.
# Needs repo secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on the Dayspring account; not a Drove token).
name: Worker OpenAI secret

on:
  workflow_dispatch:

concurrency:
  group: worker-openai-secret
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  put-secret:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: setup-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - id: npm-ci
        run: npm ci
      - id: put
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c1f7fb7e8c746389e2c56c499805d3e1
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY repo secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN repo secret is missing"; exit 1; }
          # Length and sha256 prefix only, so the value can be matched without being shown.
          echo "OPENAI_API_KEY length=${#OPENAI_API_KEY} sha8=$(printf '%s' "$OPENAI_API_KEY" | sha256sum | cut -c1-8)"
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --env production
          npx wrangler secret list --env production --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s).map(x=>x.name);console.log("OPENAI_API_KEY present:",n.includes("OPENAI_API_KEY"))})'
