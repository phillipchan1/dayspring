# The cheap gate Vera asked for: typecheck + the unit tests that already exist.
# Without this file, PRs cannot be certified (past PRs failed as "no gate").
#
# Root package: `typecheck` (tsc -b --noEmit) and `test` (vitest run).
# site/ is a separate package with `test` only — no typecheck script.
# Deliberately not e2e, desktop, or iOS. Those stay on their own workflows.
# scripts/guard-public-ci.mjs fails the job if any workflow step is not on
# the default-deny allowlist (or uploads anything other than the reserved
# checksum-report path).
name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dayspring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: setup-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # 22, matching Nuvo: @supabase/supabase-js declares node >= 22.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - id: npm-ci
        run: npm ci
      - id: guard
        name: Public-repo artifact allowlist
        run: node scripts/guard-public-ci.mjs
      - id: typecheck
        name: Typecheck (app)
        run: npm run typecheck
      - id: test
        name: Unit tests (app)
        run: npm test
      - id: worker-check
        name: Worker auth + isolation checks
        env:
          DAYSPRING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dayspring
        run: npm run check:worker
      - id: cf-preview
        name: Preview wrangler dry-run
        run: |
          mkdir -p dist
          test -f dist/index.html || printf '<!doctype html><title>dayspring</title>\n' > dist/index.html
          npx wrangler deploy --env preview --dry-run
      - id: site-install
        name: Install site
        run: npm ci --prefix site
      - id: site-test
        name: Unit tests (site)
        run: npm test --prefix site

  isolation-mutation:
    name: isolation-mutation
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: setup-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - id: npm-ci
        run: npm ci
      - id: isolation-mutation
        name: Isolation mutation proof
        run: npm run check:isolation-mutation
