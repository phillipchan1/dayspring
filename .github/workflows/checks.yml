# The cheap gate Vera asked for: typecheck + the unit tests that already exist.
# Without this file, PRs cannot be certified (past PRs failed as "no gate").
#
# Root package: `typecheck` (tsc -b --noEmit) and `test` (vitest run).
# site/ is a separate package with `test` only — no typecheck script.
# Deliberately not e2e, desktop, or iOS. Those stay on their own workflows.
name: checks

on:
  push:
    branches-ignore: []
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dayspring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, matching Nuvo: @supabase/supabase-js declares node >= 22.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - name: Typecheck (app)
        run: npm run typecheck
      - name: Unit tests (app)
        run: npm test
      - name: Worker auth + isolation checks
        env:
          DAYSPRING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dayspring
        run: npm run check:worker
      - name: Preview wrangler dry-run
        run: |
          mkdir -p dist
          test -f dist/index.html || printf '<!doctype html><title>dayspring</title>\n' > dist/index.html
          npx wrangler deploy --env preview --dry-run
      - name: Install site
        run: npm ci --prefix site
      - name: Unit tests (site)
        run: npm test --prefix site

  isolation-mutation:
    name: isolation-mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolation mutation proof
        run: npm run check:isolation-mutation
