# Compiles the native shell (src-tauri) for both Apple targets on every PR that
# touches it — the first place Rust changes meet a compiler before they reach
# the release workflows. `cargo check` only: no bundling, no signing, no IPA.
#
# Setup mirrors release.yml (Mac) and ios-release.yml (iOS): stable Rust with
# the target installed, swatinem/rust-cache on src-tauri/target. Node isn't
# needed — `tauri::generate_context!` only needs `frontendDist` (../dist) to
# exist, and a debug check embeds nothing from it — so an empty dist/ stands
# in for the Vite build.
name: native-check

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/native-check.yml'
  workflow_dispatch:

concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: cargo check (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, aarch64-apple-ios]
    env:
      # Matches bundle.iOS.minimumSystemVersion in tauri.conf.json.
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - id: setup-rust
        name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios

      - id: cache-rust
        name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"
          # Literal prefix so the guard's command-position `$` deny does not
          # treat this cache-key expression as a dirty command. Still partitioned
          # by matrix target (darwin vs ios).
          key: native-check ${{ matrix.target }}

      - id: dist
        name: Stand in for the web build
        run: mkdir -p dist

      - id: cargo-check
        name: cargo check
        working-directory: src-tauri
        run: cargo check --target ${{ matrix.target }}
