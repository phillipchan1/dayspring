<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in… — Dayspring</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fdf8f3;
      color: #5a4a3a;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 360px;
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      display: block;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #3d2f1f;
    }
    p {
      font-size: 0.9rem;
      color: #8a7060;
      line-height: 1.5;
    }
    .error h1 { color: #a04030; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <span class="icon">✓</span>
    <h1>Signed in</h1>
    <p>You can close this tab and return to Dayspring.</p>
  </div>

  <script>
    // Forward all query params (code, state, etc.) to the Tauri deep-link scheme.
    // The desktop app's initDeepLinkAuth() listener picks this up and exchanges
    // the PKCE code for a session.
    var search = window.location.search;
    if (search && search.includes('code=')) {
      window.location.href = 'dayspring://auth-callback' + search;
    } else if (!search || !search.includes('code=')) {
      var card = document.getElementById('card');
      card.classList.add('error');
      card.querySelector('.icon').textContent = '✕';
      card.querySelector('h1').textContent = 'Sign-in failed';
      card.querySelector('p').textContent = 'No authorization code was returned. Please try signing in again.';
    }
  </script>
</body>
</html>
